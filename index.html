    function formatDate(iso) {
      const d = new Date(iso+"T00:00:00");
      return d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});

    function getWeekKey(dateISO) {
      const d = new Date((dateISO||todayISO())+"T00:00:00");
      const jan4 = new Date(d.getFullYear(),0,4);
      const week = Math.ceil(((d-jan4)/86400000+jan4.getDay()+1)/7);
      return d.getFullYear()+"-W"+String(week).padStart(2,"0");
    }
    function getProgression(exName, currentSets, history) {
      for (let i=0;i<history.length;i++) {
        const entry = history[i];
        const found = entry.exercises.find(e=>e.name===exName);
        if (found) {
          const prevVol  = found.sets.reduce((a,s)=>a+(s.reps*s.weight),0);
          const currVol  = currentSets.reduce((a,s)=>a+(s.reps*s.weight),0);
          const prevMax  = Math.max(...found.sets.map(s=>s.weight));
          const currMax  = Math.max(...currentSets.map(s=>s.weight));
          if (currMax>prevMax) return {type:"up",diff:currMax-prevMax,diffVolume:currVol-prevVol};
          if (currMax<prevMax) return {type:"down",diff:prevMax-currMax,diffVolume:currVol-prevVol};
          if (currVol>prevVol) return {type:"volume_up",diffVolume:currVol-prevVol};
          if (currVol<prevVol) return {type:"volume_down",diffVolume:prevVol-currVol};
          return {type:"equal"};
        }
      }
      return null;
    }
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX=800; let w=img.width, h=img.height;
          if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          callback(canvas.toDataURL("image/jpeg",0.7).split(",")[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── VOICE INPUT ──
    function useVoiceInput(onTranscript) {
      const [voiceState, setVoiceState] = useState("idle"); // idle | listening
      const [interimText, setInterimText]   = useState("");
      const recogRef = useRef(null);

      const SR = (typeof window !== "undefined")
        ? (window.SpeechRecognition || window.webkitSpeechRecognition || null)
        : null;
      const supported = !!SR;

      const start = useCallback(() => {
        if (!SR) return;
        // Para qualquer instância anterior
        if (recogRef.current) {
          try { recogRef.current.abort(); } catch(e) {}
          recogRef.current = null;
        }
        const r = new SR();
        r.lang            = "pt-BR";
        r.continuous      = false;
        r.interimResults  = true;
        r.maxAlternatives = 1;
        recogRef.current  = r;

        r.onstart  = () => { setVoiceState("listening"); setInterimText(""); };
        r.onresult = (e) => {
          let interim = "", final_ = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) final_ += t;
            else interim += t;
          }
          if (interim) setInterimText(interim);
          if (final_) {
            setInterimText("");
            setVoiceState("idle");
            recogRef.current = null;
            onTranscript(final_.trim());
          }
        };
        r.onerror  = ()  => { setVoiceState("idle"); setInterimText(""); recogRef.current = null; };
        r.onend    = ()  => { setVoiceState("idle"); setInterimText(""); recogRef.current = null; };
        try { r.start(); } catch(e) { setVoiceState("idle"); }
      }, [SR, onTranscript]);

      const stop = useCallback(() => {
        if (recogRef.current) {
          try { recogRef.current.stop(); } catch(e) {}
          recogRef.current = null;
        }
        setVoiceState("idle");
        setInterimText("");
      }, []);

      return { supported, voiceState, interimText, start, stop };
    }

    // ── SVG HEXAGON ──
    function Hexagon({size=48, fill="transparent", stroke=C.border, strokeWidth=1.5, children, style={}, onClick}) {
      const s = size;
      const w = s;
      const h = s * 1.1547;
      // flat-top hexagon points
      const pts = [
        [w*0.25,0],[w*0.75,0],[w,h*0.5],[w*0.75,h],[w*0.25,h],[0,h*0.5]
      ].map(p=>p.join(",")).join(" ");
      return (
        <div onClick={onClick} style={{position:"relative",width:w,height:h,flexShrink:0,...style,cursor:onClick?"pointer":"default"}}>
          <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",top:0,left:0}}>
            <polygon points={pts} fill={fill} stroke={stroke} strokeWidth={strokeWidth}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {children}
          </div>
        </div>
      );
    }

    function CoachScreen({user, history, feelings, workouts, profile, onBack}) {
      const [messages,   setMessages]   = useState([]);
      const [input,      setInput]      = useState("");
      const [loading,    setLoading]    = useState(false);
      const [booting,    setBooting]    = useState(true);
      const [savedAt,    setSavedAt]    = useState(0); // nº de msgs quando salvou pela última vez
      const chatEndRef   = useRef(null);
      const messagesRef  = useRef([]);            // ref espelho para acesso sem closure stale

      // Mantém ref sincronizada
      useEffect(()=>{ messagesRef.current = messages; }, [messages]);
      useEffect(()=>{ if(chatEndRef.current) chatEndRef.current.scrollIntoView({behavior:"smooth"}); }, [messages]);

      // ── MONTA O SYSTEM PROMPT COM MEMÓRIA E CONTEXTO ──
      const buildSystem = (memory) => {
        const name = profile?.display_name || user.email?.split("@")[0] || "atleta";
        const body = profile?.weight && profile?.height
          ? `${profile.weight}kg, ${profile.height}cm`

        const feelingLines = Object.entries(feelings)
          .sort((a,b)=>b[0].localeCompare(a[0]))

        const memoryLines = memory.length > 0

        return `Você é o COACH do IRON LOG, personal trainer digital deste atleta.
Seu estilo: direto, humano, informal. Você conhece o atleta pelo nome e usa o histórico real dele nas respostas.

${feelingLines.length ? feelingLines.join("\n") : "Sem registros."}

━━ MEMÓRIA DE CONVERSAS ANTERIORES ━━
${memoryLines.join("\n")}

━━ INSTRUÇÕES ━━

      };

      // ── GERA E SALVA RESUMO DA CONVERSA (chamado progressivamente) ──
      const saveProgressiveSummary = useCallback(async (msgs) => {
        if(msgs.length < 4) return;            // mínimo de troca real
        try {
          const convo = msgs
            .map(m=>`${m.role==="user"?"Atleta":"Coach"}: ${m.content}`)
            .join("\n");
          const res = await fetch(apiUrl+"analyze", {
            method:"POST", headers:{"Content-Type":"application/json"},

              system: "Você resume conversas entre um atleta e seu coach de treino. Gere um resumo em português com no máximo 180 palavras focando em: dúvidas levantadas, conselhos dados, ajustes de treino discutidos, estado emocional do atleta. Responda apenas o resumo, sem título nem formatação.",

      // ── INIT: busca memória e gera abertura personalizada ──
      useEffect(()=>{

        (async()=>{

              method:"POST", headers:{"Content-Type":"application/json"},
              body: JSON.stringify({
                system,
                messages:[{role:"user", content:"oi"}]
              })

            if(cancelled) return;
            const data = await res.json();
            const text = (data.content?.[0]?.text||"").trim() || "E aí! Tô aqui. O que rola? 💪";
            if(!cancelled){
              const opening = [{role:"assistant", content:text, _sys:system}];
              setMessages(opening);
              messagesRef.current = opening;
            }
          } catch(e){

              const fallback = [{role:"assistant", content:"E aí! Tô aqui pro que precisar. 💪", _sys:""}];
              setMessages(fallback);
              messagesRef.current = fallback;
            }
          }

      // ── SALVAR no visibilitychange (best-effort, não é o único trigger) ──
      useEffect(()=>{

        try {
          const apiMsgs = newMsgs.map(m=>({role:m.role, content:m.content}));
          const res = await fetch(apiUrl+"analyze", {
            method:"POST", headers:{"Content-Type":"application/json"},

          // Salva resumo progressivamente a cada 8 mensagens (4 trocas completas)
          if(withReply.length >= 4 && withReply.length % 8 === 0) {

            saveProgressiveSummary(withReply);

   // ── FLOATING WORKOUT BALL ──
    // Bolinha flutuante: EXCLUSIVAMENTE temporizador de descanso
   function FloatingWorkoutBall({ workoutActive }) {
      const [restSeconds,  setRestSeconds]  = useState(null);   // null = parado
      const [restTotal,    setRestTotal]    = useState(60);      // último preset usado
      const [restRunning,  setRestRunning]  = useState(false);   // contando ou pausado
      const [restAlarm,    setRestAlarm]    = useState(false);   // tocou o alarme
      const [expanded,     setExpanded]     = useState(false);
      const [pos,          setPos]          = useState({ x: 20, y: 120 });
      const dragging    = useRef(false);
      const dragOffset  = useRef({ x: 0, y: 0 });
      const movedPx     = useRef(0);          // acumula pixels movidos
      const startPos    = useRef({ x: 0, y: 0 });
      const ballRef     = useRef(null);
      const workerRef   = useRef(null);

      const REST_PRESETS = [
        { label: "30s",  val: 30  },
        { label: "1min", val: 60  },
        { label: "90s",  val: 90  },
        { label: "2min", val: 120 },
        { label: "3min", val: 180 },
      ];

      // ── Web Worker para o temporizador de descanso (não throttle em background) ──
      const startWorker = useCallback((seconds) => {
        if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; }
        const blob = new Blob([`
          let s = 0;
          const total = ${seconds};
          self.onmessage = function(e) {
            if (e.data === 'stop') { clearInterval(_t); self.close(); }
          };
          const _t = setInterval(function() {
            s++;
            const remaining = total - s;
            self.postMessage({ remaining, done: remaining <= 0 });
            if (remaining <= 0) { clearInterval(_t); }
          }, 1000);
        `], { type: 'application/javascript' });
        const w = new Worker(URL.createObjectURL(blob));
        workerRef.current = w;
        w.onmessage = (e) => {
          if (e.data.done) {
            setRestSeconds(0);
            setRestRunning(false);
            workerRef.current = null;
            try { navigator.vibrate && navigator.vibrate([300, 100, 300, 100, 300]); } catch(err) {}
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              [0, 0.3, 0.6].forEach(t => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 880; gain.gain.value = 0.25;
                osc.start(ctx.currentTime + t);
                osc.stop(ctx.currentTime + t + 0.25);
              });
            } catch(err) {}
            setRestAlarm(true);
            setTimeout(() => setRestAlarm(false), 3000);
          } else {
            setRestSeconds(e.data.remaining);
          }
        };
      }, []);

      const stopWorker = useCallback(() => {
        if (workerRef.current) {
          workerRef.current.postMessage('stop');
          workerRef.current.terminate();
          workerRef.current = null;
        }
      }, []);

      // Limpa worker ao desmontar ou ao parar treino
      useEffect(() => {
        if (!workoutActive) {
          stopWorker();
          setRestSeconds(null);
          setRestRunning(false);
          setRestAlarm(false);
        }
        return () => stopWorker();
      }, [workoutActive, stopWorker]);

      const handlePreset = (val) => {
        stopWorker();
        setRestTotal(val);
        setRestSeconds(val);
        setRestRunning(true);
        setRestAlarm(false);
        startWorker(val);
        setExpanded(false);
      };

      const handlePlayPause = () => {
        if (restAlarm) {
          // limpa alarme, reseta
          setRestAlarm(false);
          setRestSeconds(null);
          setRestRunning(false);
          return;
        }
        if (restRunning) {
          // PAUSA: mata o worker, mantém o tempo atual
          stopWorker();
          setRestRunning(false);
        } else if (restSeconds !== null && restSeconds > 0) {
          // RETOMA do ponto atual
          setRestRunning(true);
          startWorker(restSeconds);
        } else {
          // Sem timer ativo: abre o painel para escolher preset
          setExpanded(true);
        }
      };

      const handleReset = () => {
        stopWorker();
        setRestSeconds(restTotal);
        setRestRunning(false);
        setRestAlarm(false);
      };

      // ── Drag com pointer events — threshold de 8px para diferenciar tap de drag ──
      const DRAG_THRESHOLD = 8;

      const onPointerDown = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        dragging.current  = false;
        movedPx.current   = 0;
        startPos.current  = { x: e.clientX, y: e.clientY };
        const rect = ballRef.current.getBoundingClientRect();
        dragOffset.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        ballRef.current.setPointerCapture(e.pointerId);
      }, []);

      const onPointerMove = useCallback((e) => {
        const dx = e.clientX - startPos.current.x;
        const dy = e.clientY - startPos.current.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > DRAG_THRESHOLD) {
          dragging.current = true;
        }
        if (!dragging.current) return;
        const nx = e.clientX - dragOffset.current.x;
        const ny = e.clientY - dragOffset.current.y;
        const maxX = window.innerWidth  - 72;
        const maxY = window.innerHeight - 72;
        setPos({ x: Math.max(0, Math.min(nx, maxX)), y: Math.max(0, Math.min(ny, maxY)) });
      }, []);

      const onPointerUp = useCallback((e) => {
        e.preventDefault();
        if (!dragging.current) {
          // É tap — toggle expanded
          setExpanded(ex => !ex);
        }
        dragging.current = false;
        movedPx.current  = 0;
      }, []);

      const formatTime = (s) => {
        if (s === null) return "--:--";
        const m = Math.floor(Math.max(0, s) / 60);
        const sec = Math.max(0, s) % 60;
        return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
      };

      // Progresso para o anel SVG
      const pct      = (restTotal > 0 && restSeconds !== null) ? restSeconds / restTotal : 0;
      const SIZE     = 68;
      const STROKE   = 4;
      const R        = (SIZE - STROKE * 2) / 2;
      const CIRCUM   = 2 * Math.PI * R;

      if (!workoutActive) return null;

      // Cor do anel
      const ringColor = restAlarm ? C.red
        : restSeconds !== null && restSeconds <= 5 ? C.red
        : C.accent;

      // Ícone central
      const centerIcon = restAlarm ? "🔔"
        : restRunning ? "⏸"
        : restSeconds !== null && restSeconds > 0 ? "▶"
        : "⏱";

      return (
        <>
          <style>{`
            @keyframes alarmRing { 0%,100%{opacity:1} 50%{opacity:0.2} }
            @keyframes ballPop   { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }
            @keyframes ringPulse { 0%,100%{box-shadow:0 0 8px ${C.accent}55} 50%{box-shadow:0 0 20px ${C.accent}cc} }
          `}</style>

          {/* OVERLAY para fechar painel */}
          {expanded && (
            <div
              onPointerDown={() => setExpanded(false)}
              style={{ position: "fixed", inset: 0, zIndex: 999 }}
            />
          )}

          {/* BOLINHA */}
          <div
            ref={ballRef}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            style={{
              position: "fixed",
              left: pos.x,
              top:  pos.y,
              width:  SIZE,
              height: SIZE,
              zIndex: 1000,
              touchAction: "none",
              userSelect: "none",
              WebkitUserSelect: "none",
              cursor: "pointer",
              animation: "ballPop 0.2s ease",
            }}
          >
            {/* SVG anel de progresso */}
            <svg
              width={SIZE} height={SIZE}
              viewBox={`0 0 ${SIZE} ${SIZE}`}
              style={{ position: "absolute", top: 0, left: 0, transform: "rotate(-90deg)", pointerEvents: "none" }}
            >
              <circle cx={SIZE/2} cy={SIZE/2} r={R} fill="none" stroke="rgba(200,255,62,0.12)" strokeWidth={STROKE} />
              {restSeconds !== null && (
                <circle
                  cx={SIZE/2} cy={SIZE/2} r={R}
                  fill="none"
                  stroke={ringColor}
                  strokeWidth={STROKE}
                  strokeDasharray={`${CIRCUM * pct} ${CIRCUM}`}
                  strokeLinecap="round"
                  style={{
                    transition: restRunning ? "stroke-dasharray 0.85s linear" : "none",
                    animation: restAlarm ? "alarmRing 0.5s infinite" : "none",
                  }}
                />
              )}
            </svg>

            {/* Círculo central */}
            <div style={{
              position: "absolute", inset: STROKE * 2,
              borderRadius: "50%",
              background: "rgba(8,10,6,0.96)",
              border: `1px solid ${restAlarm ? C.red : C.accent}44`,
              display: "flex", flexDirection: "column",
              alignItems: "center", justifyContent: "center",
              gap: 0,
              boxShadow: restAlarm
                ? `0 0 18px ${C.red}66`
                : restRunning
                  ? `0 0 14px ${C.accent}44`
                  : `0 0 8px rgba(0,0,0,0.5)`,
              animation: restAlarm ? "alarmRing 0.5s infinite" : restRunning ? "ringPulse 2s infinite" : "none",
              pointerEvents: "none",
            }}>
              <span style={{ fontSize: 18, lineHeight: 1 }}>{centerIcon}</span>
              <span style={{
                fontFamily: "'Oswald',Impact,sans-serif",
                fontSize: 11,
                fontWeight: 700,
                color: restAlarm ? C.red : restSeconds !== null && restSeconds <= 5 ? C.red : C.accent,
                letterSpacing: 1,
                lineHeight: 1,
                marginTop: 2,
              }}>
                {formatTime(restSeconds)}
              </span>
            </div>
          </div>

          {/* PAINEL EXPANDIDO */}
          {expanded && (
            <div
              onPointerDown={e => e.stopPropagation()}
              style={{
                position: "fixed",
                left: Math.min(pos.x, window.innerWidth - 220),
                top: pos.y + SIZE + 10,
                width: 210,
                background: "rgba(8,10,6,0.98)",
                border: `1px solid ${C.accent}55`,
                borderRadius: 10,
                padding: "14px 12px 12px",
                zIndex: 1001,
                boxShadow: `0 8px 32px rgba(0,0,0,0.85), 0 0 20px ${C.accent}22`,
              }}
            >
              {/* Handle */}
              <div style={{ width: 28, height: 3, borderRadius: 2, background: C.border, margin: "0 auto 12px" }} />

              {/* Label */}
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted2, textTransform: "uppercase", marginBottom: 10 }}>
                ⏱ DESCANSO
              </div>

              {/* PRESETS */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 10 }}>
                {REST_PRESETS.map(p => (
                  <button
                    key={p.val}
                    onPointerDown={e => { e.stopPropagation(); handlePreset(p.val); }}
                    style={{
                      padding: "11px 4px",
                      borderRadius: 4,
                      background: restTotal === p.val && restSeconds !== null ? C.accentDim : "#0d100b",
                      border: `1px solid ${restTotal === p.val && restSeconds !== null ? C.accent : C.border}`,
                      color: restTotal === p.val && restSeconds !== null ? C.accent : C.muted2,
                      fontSize: 13,
                      fontWeight: 700,
                      cursor: "pointer",
                      fontFamily: "'Barlow Condensed',sans-serif",
                    }}
                  >{p.label}</button>
                ))}
              </div>

              {/* PLAY/PAUSE + RESET */}
              {restSeconds !== null && (
                <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                  <button
                    onPointerDown={e => { e.stopPropagation(); handlePlayPause(); }}
                    style={{
                      flex: 2,
                      padding: "10px",
                      borderRadius: 4,
                      background: restRunning ? C.redDim : C.accentDim,
                      border: `1px solid ${restRunning ? C.red + "55" : C.accent + "55"}`,
                      color: restRunning ? C.red : C.accentText,
                      fontSize: 13,
                      fontWeight: 700,
                      cursor: "pointer",
                      fontFamily: "'Barlow Condensed',sans-serif",
                    }}
                  >{restRunning ? "⏸ PAUSAR" : "▶ RETOMAR"}</button>
                  <button
                    onPointerDown={e => { e.stopPropagation(); handleReset(); }}
                    style={{
                      flex: 1,
                      padding: "10px",
                      borderRadius: 4,
                      background: "transparent",
                      border: `1px solid ${C.border}`,
                      color: C.muted2,
                      fontSize: 12,
                      fontWeight: 700,
                      cursor: "pointer",
                      fontFamily: "'Barlow Condensed',sans-serif",
                    }}
                  >↺</button>
                </div>
              )}

              {/* Dica de uso */}
              <div style={{ padding: "6px 4px 2px", textAlign: "center" }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 1, lineHeight: 1.5 }}>
                  Toque para abrir/fechar<br/>Arraste para mover
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // ════════════════════════════════════════════════════════════
    //  MAIN APP
    // ════════════════════════════════════════════════════════════
    function GymLog({user, onSignOut}) {
      const [workouts,   setWorkouts]   = useState({});
      const [history,    setHistory]    = useState([]);
      const [feelings,   setFeelings]   = useState({});
      const [weekPhotos, setWeekPhotos] = useState({});
      const [activeDay,  setActiveDay]  = useState(getTodayKey()==="dom"?"seg":getTodayKey());
      const [modal,      setModal]      = useState(null);
      const [editId,     setEditId]     = useState(null);
      const [loading,    setLoading]    = useState(true);
      const [saving,     setSaving]     = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [bottomTab,  setBottomTab]  = useState("inicio");
      const [exerciseName, setExerciseName] = useState("");
      const [sets,       setSets]       = useState([{reps:"",weight:""}]);
      const [aiReport,   setAiReport]   = useState("");
      const [aiLoading,  setAiLoading]  = useState(false);
      const [aiError,    setAiError]    = useState("");
      const [todayEnergy,setTodayEnergy]= useState(null);
      const [todayResult,setTodayResult]= useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput,    setChatInput]    = useState("");
      const [chatLoading,  setChatLoading]  = useState(false);
      const [profile,      setProfile]      = useState(null);
      const [menuOpen,     setMenuOpen]     = useState(false);
      const [workoutActive,    setWorkoutActive]    = useState(false);
      const [workoutSeconds,   setWorkoutSeconds]   = useState(0);
      const [motiveBanner,     setMotiveBanner]     = useState("");
      const [motiveVisible,    setMotiveVisible]    = useState(false);
      const [showMigrate,  setShowMigrate]  = useState(false);
      const [migrating,    setMigrating]    = useState(false);
      const [editingName,   setEditingName]   = useState(false);
      const [nameInput,     setNameInput]     = useState("");
      const [weightInput,   setWeightInput]   = useState("");
      const [heightInput,   setHeightInput]   = useState("");
      const [savingProfile, setSavingProfile] = useState(false);
      const [profileMsg,    setProfileMsg]    = useState("");
      const [avatarInput,   setAvatarInput]   = useState("");
      const [quickMenuOpen, setQuickMenuOpen] = useState(false);
      const avatarRef = useRef(null);
      const chatEndRef = useRef(null);

      const currentWeekKey = getWeekKey(todayISO());
      const currentPhotos  = weekPhotos[currentWeekKey] || {};

      useEffect(()=>{
        const hasLocal = localStorage.getItem("gymlog-workouts-v1")||localStorage.getItem("gymlog-history-v1")||localStorage.getItem("gymlog-feelings-v1")||localStorage.getItem("gymlog-photos-v1");
        if(hasLocal) setShowMigrate(true);
      },[]);

      const runMigration = async () => {
        if(migrating) return;
        setMigrating(true);
        try {
          const rawW=localStorage.getItem("gymlog-workouts-v1");
          if(rawW){const wData=JSON.parse(rawW);for(const dayKey of Object.keys(wData)){if(wData[dayKey]&&wData[dayKey].length>0)await db.saveWorkout(user.id,dayKey,wData[dayKey]);}}
          const rawH=localStorage.getItem("gymlog-history-v1");
          if(rawH){const hData=JSON.parse(rawH);for(const entry of hData)await db.saveHistory(user.id,entry.date,entry.day,entry.exercises);}
          const rawF=localStorage.getItem("gymlog-feelings-v1");
          if(rawF){const fData=JSON.parse(rawF);for(const date of Object.keys(fData)){const f=fData[date];await db.saveFeeling(user.id,date,f.energy||null,f.result||null);}}
          const rawP=localStorage.getItem("gymlog-photos-v1");
          if(rawP){const pData=JSON.parse(rawP);for(const weekKey of Object.keys(pData)){const photos=pData[weekKey];if(photos.front)await db.savePhoto(user.id,weekKey,"front",photos.front);if(photos.side)await db.savePhoto(user.id,weekKey,"side",photos.side);if(photos.back)await db.savePhoto(user.id,weekKey,"back",photos.back);}}
          localStorage.removeItem("gymlog-workouts-v1");localStorage.removeItem("gymlog-history-v1");localStorage.removeItem("gymlog-feelings-v1");localStorage.removeItem("gymlog-photos-v1");
          setShowMigrate(false);await loadAll();alert("✅ Dados migrados com sucesso!");
        } catch(e){alert("❌ Erro na migração: "+e.message);}
        setMigrating(false);
      };

      useEffect(()=>{ loadAll(); },[]);
      useEffect(()=>{
        if(profile){
          setNameInput(profile.display_name||"");
          setWeightInput(profile.weight||"");
          setHeightInput(profile.height||"");
          setAvatarInput(profile.avatar||"");
        }
      },[profile]);
      useEffect(()=>{ if(!timerRunning)return; const t=setInterval(()=>setTimerSeconds(s=>s+1),1000); return()=>clearInterval(t); },[timerRunning]);
      // Cronômetro geral do treino — Web Worker para não throttle em background
      const workerRef = useRef(null);
      const wakeLockRef = useRef(null);

      useEffect(()=>{
        if(!workoutActive){
          // Mata o worker e libera o wake lock ao parar
          if(workerRef.current){ workerRef.current.terminate(); workerRef.current = null; }
          if(wakeLockRef.current){ try{ wakeLockRef.current.release(); }catch(e){} wakeLockRef.current = null; }
          return;
        }
        // Cria Web Worker inline via Blob — imune ao throttle do browser
        const blob = new Blob([`
          let s = 0;
          self.onmessage = function(e){ if(e.data === 'reset') s = 0; };
          setInterval(function(){ s++; self.postMessage(s); }, 1000);
        `], {type:'application/javascript'});
        const w = new Worker(URL.createObjectURL(blob));
        w.onmessage = (e) => setWorkoutSeconds(e.data);
        workerRef.current = w;
        // WakeLock: mantém a tela acesa enquanto o treino está ativo
        if('wakeLock' in navigator){
          navigator.wakeLock.request('screen').then(lock => {
            wakeLockRef.current = lock;
          }).catch(()=>{});
        }
        // Reaquire o wake lock ao voltar para a tela (ele é liberado automaticamente quando vai para background)
        const handleVisibility = () => {
          if(document.visibilityState === 'visible' && 'wakeLock' in navigator){
            navigator.wakeLock.request('screen').then(lock => {
              wakeLockRef.current = lock;
            }).catch(()=>{});
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return ()=>{
          w.terminate();
          workerRef.current = null;
          document.removeEventListener('visibilitychange', handleVisibility);
        };
      }, [workoutActive]);
      
      
      useEffect(()=>{ const today=todayISO(); if(feelings[today]){setTodayEnergy(feelings[today].energy||null);setTodayResult(feelings[today].result||null);}else{setTodayEnergy(null);setTodayResult(null);} },[feelings]);
      useEffect(()=>{ if(chatEndRef.current)chatEndRef.current.scrollIntoView({behavior:"smooth"}); },[chatMessages]);

      const loadAll = async () => {
        try {
          const [w,h,f,p,prof]=await Promise.all([db.getWorkouts(user.id),db.getHistory(user.id),db.getFeelings(user.id),db.getPhotos(user.id),db.getProfile(user.id)]);
          setWorkouts(w);setHistory(h);setFeelings(f);setWeekPhotos(p);setProfile(prof);
          const today=todayISO();
          if(f[today]){setTodayEnergy(f[today].energy||null);setTodayResult(f[today].result||null);}
        } catch(e){console.error(e);}
        setLoading(false);
      };

      const saveWorkoutFn = async (dayKey, exercises) => {
        setSaving(true);
        try{await db.saveWorkout(user.id,dayKey,exercises);}catch(e){}
        setTimeout(()=>setSaving(false),600);
      };

      const saveEnergy = async (value) => {
        const today=todayISO(); const cur=feelings[today]||{};
        const upd={...feelings,[today]:{...cur,energy:value}};
        setFeelings(upd);setTodayEnergy(value);
        await db.saveFeeling(user.id,today,value,cur.result||null);
        setModal(null);
      };

      const saveResult = async (value) => {
        const today=todayISO(); const cur=feelings[today]||{};
        const upd={...feelings,[today]:{...cur,result:value}};
        setFeelings(upd);setTodayResult(value);
        await db.saveFeeling(user.id,today,cur.energy||null,value);
        setModal(null);
        await doFinishWorkout();
      };

      const doFinishWorkout = async () => {
        const exs=workouts[activeDay]||[];
        if(exs.length===0)return;
        const today=todayISO();
        await db.saveHistory(user.id,today,activeDay,exs);
        const entry={date:today,day:activeDay,exercises:exs};
        setHistory(prev=>[entry,...prev.filter(h=>!(h.date===today&&h.day===activeDay))]);
        stopWorkout();
        alert("✅ Treino salvo no histórico!");
      };

      const finishWorkout = () => {
        const exs=workouts[activeDay]||[];
        if(exs.length===0)return;
        if(!todayEnergy)setModal("energy_then_result");
        else setModal("result");
      };

      const startWorkout = async () => {
        setWorkoutActive(true);
        setWorkoutSeconds(0);
        setMotiveBanner("");
        setMotiveVisible(false);
      
        // Busca histórico do mesmo dia da semana passada
        const lastWeek = history.filter(h => h.day === activeDay);
        if(lastWeek.length === 0) return;
        const lastEntry = lastWeek[0];
      
        try {
          const apiUrl = window.AI_API_URL;
          const exerciseSummary = lastEntry.exercises.map(ex => {
            const maxW = Math.max(...ex.sets.map(s=>s.weight));
            return `${ex.name}: ${ex.sets.length} séries, carga máx ${maxW}kg`;
          }).join("; ");
      
          const res = await fetch(apiUrl+"analyze", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              system: "Você é um personal trainer motivacional. Gere UMA frase curta (máx 15 palavras) e motivadora comparando com o treino anterior. Seja direto e incisivo. Responda APENAS a frase, sem aspas.",
              messages:[{role:"user", content:`Treino anterior (${lastEntry.date}): ${exerciseSummary}. Gere uma frase motivacional para o treino de hoje.`}]
            })
          });
          if(!res.ok) return;
          const data = await res.json();
          const text = data.content&&data.content[0] ? data.content[0].text.trim() : "";
          if(text){ setMotiveBanner(text); setMotiveVisible(true); setTimeout(()=>setMotiveVisible(false), 6000); }
        } catch(e){}
      };
      
      const stopWorkout = () => {
        setWorkoutActive(false);
        setWorkoutSeconds(0);
        setMotiveVisible(false);
      };
      
      const formatWorkoutTime = (s) => {
        const h = Math.floor(s/3600);
        const m = Math.floor((s%3600)/60);
        const sec = s%60;
        if(h>0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
        return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      };

      const saveProfile = async () => {
        setSavingProfile(true);
        try {
          await sb.from("profiles").upsert({
            id: user.id,
            display_name: nameInput.trim()||null,
            weight: weightInput ? Number(weightInput) : null,
            height: heightInput ? Number(heightInput) : null,
            avatar: avatarInput||null,
          }, {onConflict:"id"});
          setProfile(p=>({...p, display_name:nameInput.trim()||null, weight:weightInput?Number(weightInput):null, height:heightInput?Number(heightInput):null, avatar:avatarInput||null}));
          setProfileMsg("✓ SALVO");
          setEditingName(false);
          setTimeout(()=>setProfileMsg(""), 2000);
        } catch(e){ setProfileMsg("❌ Erro ao salvar"); }
        setSavingProfile(false);
      };

      const handleAvatarUpload = (file) => {
        if(!file) return;
        compressImage(file, async (base64) => {
          setAvatarInput(base64);
          try {
            await sb.from("profiles").upsert({
              id: user.id, avatar: base64
            }, {onConflict:"id"});
          } catch(e){ console.error("Erro ao salvar avatar:", e); }
        });
      };

      const handlePhotoUpload = (slot, file) => {
        if(!file)return;
        compressImage(file, async(base64)=>{
          const upd={...weekPhotos,[currentWeekKey]:{...currentPhotos,[slot]:base64}};
          setWeekPhotos(upd);
          await db.savePhoto(user.id,currentWeekKey,slot,base64);
        });
      };

      const removePhoto = async (slot) => {
        const upd={...weekPhotos};
        if(upd[currentWeekKey]){upd[currentWeekKey]={...upd[currentWeekKey]};delete upd[currentWeekKey][slot];}
        setWeekPhotos(upd);
        await db.removePhoto(user.id,currentWeekKey,slot);
      };

      const buildAIContext = (photos) => {
        const sevenDaysAgo=new Date();sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
        const recent=history.filter(h=>new Date(h.date+"T00:00:00")>=sevenDaysAgo);
        const older=history.filter(h=>new Date(h.date+"T00:00:00")<sevenDaysAgo);
        const comparativo=[];
        recent.forEach(entry=>{
          entry.exercises.forEach(ex=>{
            let anterior=null;
            for(let i=0;i<older.length;i++){const f=older[i].exercises.find(e=>e.name===ex.name);if(f){anterior={data:older[i].date,sets:f.sets};break;}}
            const cV=ex.sets.reduce((a,s)=>a+(s.reps*s.weight),0);const cM=Math.max(...ex.sets.map(s=>s.weight));const cR=ex.sets.reduce((a,s)=>a+s.reps,0);
            const item={exercicio:ex.name,dia:entry.day,data:entry.date,series_esta_semana:ex.sets.map((s,i)=>`S${i+1}: ${s.reps}rep x ${s.weight}kg`),volume_total_kg:cV,carga_maxima_kg:cM,total_repeticoes:cR};
            if(anterior){const pV=anterior.sets.reduce((a,s)=>a+(s.reps*s.weight),0);const pM=Math.max(...anterior.sets.map(s=>s.weight));const pR=anterior.sets.reduce((a,s)=>a+s.reps,0);item.ultima_vez=anterior.data;item.series_anterior=anterior.sets.map((s,i)=>`S${i+1}: ${s.reps}rep x ${s.weight}kg`);item.variacao_carga_kg=cM-pM;item.variacao_volume_kg=cV-pV;item.variacao_repeticoes=cR-pR;item.status=cM>pM?"PROGREDIU CARGA":cM<pM?"REGREDIU CARGA":cV>pV?"MAIS VOLUME (mesma carga)":cV<pV?"MENOS VOLUME":"IGUAL";}else{item.status="PRIMEIRO REGISTRO";}
            comparativo.push(item);
          });

                    <div style={{fontSize:8,fontWeight:700,letterSpacing:2,color:C.accentText,textTransform:"uppercase",marginBottom:3}}>FORGE AI · AGORA</div>
                    <div style={{fontSize:13,color:C.text,lineHeight:1.5,fontStyle:"italic"}}>"{motiveBanner}"</div>
                  </div>
                  <button onClick={()=>setMotiveVisible(false)} style={{background:"none",border:"none",color:C.muted,fontSize:13,cursor:"pointer",flexShrink:0,padding:"0 0 0 4px"}}>✕</button>
                </div>
              )}

              {/* Cabeçalho do dia selecionado */}
              <div style={{marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontFamily:"'Oswald',sans-serif",fontSize:20,letterSpacing:1,color:C.text,fontWeight:600,lineHeight:1}}>{currentDay.full}</div>
                  {dayExercises.length>0 && (
                    <div style={{fontSize:11,color:C.muted2,marginTop:3}}>
                      {dayExercises.length} exercício{dayExercises.length!==1?"s":""} · {dayExercises.reduce((a,ex)=>a+ex.sets.length,0)} séries
                    </div>
                  )}
                </div>
                {/* Botão iniciar treino — compacto no header quando há exercícios */}
                {!workoutActive && dayExercises.length>0 && (
                  <button
                    onClick={startWorkout}
                    style={{
                      background:C.accent,color:"#000",border:"none",borderRadius:3,
                      padding:"9px 16px",fontSize:12,fontWeight:800,letterSpacing:2,
                      cursor:"pointer",fontFamily:"'Oswald',sans-serif",
                      display:"flex",alignItems:"center",gap:6,flexShrink:0,
                    }}
                  >
                    <span style={{fontSize:11}}>▶</span> INICIAR
                  </button>
                )}
              </div>

              {/* Estado vazio */}
              {dayExercises.length===0 && (
                <div style={{textAlign:"center",padding:"48px 20px 32px",color:C.muted}}>
                  <div style={{fontSize:44,marginBottom:12,opacity:0.6}}>🏋️</div>
                  <div style={{fontFamily:"'Oswald',sans-serif",fontSize:18,letterSpacing:2,color:C.muted2,marginBottom:6,fontWeight:600}}>SEM EXERCÍCIOS</div>
                  <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:20}}>
                    {activeDay===todayKey?"Adicione os exercícios do seu treino de hoje.":"Monte o treino para "+currentDay.full+"."}
                  </div>
                  {/* Botão iniciar grande só quando vazio */}
                  {!workoutActive && (
                    <div style={{background:C.bgCard,border:`1px dashed ${C.border}`,borderRadius:6,padding:"16px",marginBottom:0}}>
                      <div style={{fontSize:11,color:C.muted,marginBottom:0}}>Adicione exercícios para iniciar o treino</div>
                    </div>
                  )}
                </div>
              )}

              {/* Lista de exercícios */}
              {dayExercises.map((ex,exIdx)=>{
                const prog=getProgression(ex.name,ex.sets,history);
                return (
                  <div key={ex.id} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:6,marginBottom:10,overflow:"hidden",transition:"border-color 0.2s"}}>
                    {/* Header do exercício */}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",borderBottom:`1px solid ${C.border}`,background:C.bgCard2}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                        <div style={{width:24,height:24,borderRadius:2,background:C.accentDim,border:`1px solid ${C.accent}22`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Oswald',sans-serif",fontSize:12,color:C.accentText,flexShrink:0,fontWeight:700}}>{exIdx+1}</div>
                        <div style={{minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:14,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ex.name}</div>
                          {prog&&(
                            <div style={{fontSize:10,marginTop:1,display:"flex",alignItems:"center",gap:4}}>
                              {prog.type==="up"&&<><span style={{color:C.accent,fontWeight:700}}>↑ +{prog.diff}kg</span><span style={{color:C.muted}}>vs anterior</span></>}
                              {prog.type==="down"&&<><span style={{color:C.red,fontWeight:700}}>↓ -{prog.diff}kg</span><span style={{color:C.muted}}>vs anterior</span></>}
                              {prog.type==="volume_up"&&<span style={{color:C.accent}}>↑ mais volume</span>}
                              {prog.type==="volume_down"&&<span style={{color:C.red}}>↓ menos volume</span>}
                              {prog.type==="equal"&&<span style={{color:C.muted2}}>= mesmo peso</span>}
                            </div>
                          )}
                        </div>
                      </div>
                      <div style={{display:"flex",gap:5,flexShrink:0}}>
                        <button onClick={()=>openEdit(ex)} style={{border:`1px solid ${C.border}`,background:"transparent",color:C.muted2,borderRadius:3,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>EDITAR</button>
                        <button onClick={()=>setDeleteConfirm(ex.id)} style={{border:"none",background:C.redDim,color:C.red,borderRadius:3,padding:"5px 8px",fontSize:12,fontWeight:700,cursor:"pointer",lineHeight:1}}>✕</button>
                      </div>
                    </div>
                    {/* Séries */}
                    <div>
                      {/* Header colunas */}
                      <div style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr",padding:"5px 14px",background:"#0a0c08"}}>
                        {["#","REPS","CARGA"].map(h=>(
                          <div key={h} style={{fontSize:8,fontWeight:700,letterSpacing:2,color:C.muted,textTransform:"uppercase"}}>{h}</div>
                        ))}
                      </div>
                      {ex.sets.map((set,si)=>(
                        <div key={si} style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr",padding:"9px 14px",borderTop:`1px solid ${C.border}`,alignItems:"center",background:si%2===0?"transparent":"#0a0c08"}}>
                          <div style={{fontSize:10,color:C.muted,fontFamily:"monospace"}}>S{si+1}</div>
                          <div style={{fontSize:15,fontWeight:700,color:C.text}}>{set.reps}<span style={{fontSize:10,color:C.muted,marginLeft:2}}>rep</span></div>
                          <div style={{display:"flex",alignItems:"baseline",gap:2}}>
                            <span style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:20,color:set.weight>0?C.accent:C.muted,letterSpacing:1,fontWeight:600}}>{set.weight||"—"}</span>
                            {set.weight>0&&<span style={{fontSize:9,color:C.muted}}>kg</span>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}

              {/* Espaçamento para os botões fixos não cobrirem conteúdo */}
              <div style={{height:8}} />
            </div>

            {/* ── BOTÕES FIXOS NO RODAPÉ ── */}
            {/* Gradiente de fade para suavizar a transição */}
            <div style={{
              position:"fixed",bottom:58,left:"50%",transform:"translateX(-50%)",
              width:"100%",maxWidth:480,
              background:`linear-gradient(to top, ${C.bg} 75%, transparent)`,
              padding:"20px 16px 10px",
              pointerEvents:"none",
              zIndex:15,
            }}>
              {workoutActive ? (
                /* Treino ativo: mostra botão FINALIZAR em destaque */
                <div style={{display:"flex",flexDirection:"column",gap:8,pointerEvents:"all"}}>
                  <button
                    onClick={finishWorkout}
                    style={{
                      width:"100%",
                      background:`linear-gradient(135deg,${C.accent},#a8d400)`,
                      color:"#000",border:"none",borderRadius:4,
                      padding:"16px",fontSize:15,fontWeight:800,letterSpacing:2,
                      cursor:"pointer",fontFamily:"'Oswald',sans-serif",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8,
                      boxShadow:`0 4px 24px rgba(200,255,62,0.35)`,
                    }}
                  >
                    <span style={{fontSize:16}}>✅</span> FINALIZAR TREINO
                  </button>
                  <button
                    onClick={openAdd}
                    style={{
                      width:"100%",background:"transparent",color:C.muted2,
                      border:`1px solid ${C.border}`,borderRadius:4,
                      padding:"12px",fontSize:13,fontWeight:700,letterSpacing:1,
                      cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",
                    }}
                  >+ ADICIONAR EXERCÍCIO</button>
                </div>
              ) : (
                /* Treino inativo */
                <div style={{display:"flex",flexDirection:"column",gap:8,pointerEvents:"all"}}>
                  {dayExercises.length>0 && (
                    <button
                      onClick={startWorkout}
                      style={{
                        width:"100%",
                        background:`linear-gradient(135deg,${C.accentDim},rgba(200,255,62,0.05))`,
                        color:C.accent,border:`2px solid ${C.accent}77`,borderRadius:4,
                        padding:"15px",fontSize:15,fontWeight:800,letterSpacing:3,
                        cursor:"pointer",fontFamily:"'Oswald',sans-serif",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:10,
                        boxShadow:`0 0 20px rgba(200,255,62,0.15)`,
                      }}
                    >
                      <span style={{fontSize:16}}>▶</span> INICIAR TREINO
                    </button>
                  )}
                  <button
                    onClick={openAdd}
                    style={{
                      width:"100%",background:dayExercises.length===0?C.accent:"transparent",
                      color:dayExercises.length===0?"#000":C.muted2,
                      border:dayExercises.length===0?"none":`1px solid ${C.border}`,
                      borderRadius:4,padding:"13px",fontSize:13,fontWeight:700,letterSpacing:dayExercises.length===0?2:1,
                      cursor:"pointer",fontFamily:dayExercises.length===0?"'Oswald',sans-serif":"'Barlow Condensed',sans-serif",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6,
                      boxShadow:dayExercises.length===0?`0 0 20px rgba(200,255,62,0.3)`:"none",
                    }}
                  >
                    {dayExercises.length===0?"+ NOVO EXERCÍCIO":"+ ADICIONAR EXERCÍCIO"}
                  </button>
                </div>
              )}
            </div>

            {/* BOLINHA — apenas para temporizador de descanso */}
           <FloatingWorkoutBall
              workoutActive={workoutActive}
            />

            {renderModals()}
            <BottomNav active={bottomTab} onChange={(tab)=>{setQuickMenuOpen(false);setMenuOpen(false);setBottomTab(tab);}} onPlusClick={()=>setQuickMenuOpen(true)} />
          </div>
        );
      }
      // ── PERFIL VIEW ──
      if(bottomTab==="perfil") {
        const hasBodyData = profile?.weight && profile?.height;

        const displayNameVal = nameInput || profile?.display_name || user.email?.split("@")[0] || "ATLETA";
        const initialsVal    = displayNameVal[0].toUpperCase();
        const totalWorkoutsAll = history.length;
        const totalXpAll = totalWorkoutsAll * 120;
        const levelAll   = Math.floor(totalXpAll/500)+1;
        const xpInLvl    = totalXpAll % 500;
        const memberSince = new Date(user.created_at).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

        return (
          <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Barlow Condensed',sans-serif",maxWidth:480,margin:"0 auto",paddingBottom:100,overflowY:"auto"}}>
            <style>{`
              @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap');
              *{box-sizing:border-box;} body{margin:0;background:#080a06;}
              @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
              .profile-input:focus{border-color:${C.accent}88!important;outline:none;}
            `}</style>

            {/* ── HERO DO ATLETA ── */}
            <div style={{position:"relative",background:C.bgCard,borderBottom:`1px solid ${C.border}`,overflow:"hidden",paddingBottom:24}}>
              <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at 50% 0%, rgba(200,255,62,0.08) 0%, transparent 65%)`,pointerEvents:"none"}} />
              <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(200,255,62,0.012) 2px,rgba(200,255,62,0.012) 4px)",pointerEvents:"none"}} />
              {/* corner brackets */}
              <svg style={{position:"absolute",top:8,left:8}} width="16" height="16" viewBox="0 0 16 16"><path d="M0 8 L0 0 L8 0" fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.5"/></svg>
              <svg style={{position:"absolute",top:8,right:8}} width="16" height="16" viewBox="0 0 16 16"><path d="M16 8 L16 0 L8 0" fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.5"/></svg>

              <div style={{padding:"24px 16px 0",position:"relative",zIndex:1}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:4,color:C.muted2,textTransform:"uppercase",marginBottom:20}}>PERFIL DO ATLETA</div>

                {/* AVATAR */}
                <div style={{display:"flex",alignItems:"flex-end",gap:16,marginBottom:20}}>
                  <div style={{position:"relative",flexShrink:0}}>
                    <div onClick={()=>avatarRef.current&&avatarRef.current.click()} style={{width:80,height:80,borderRadius:4,background:avatarInput?`url(data:image/jpeg;base64,${avatarInput}) center/cover`:`linear-gradient(135deg,${C.accentDim},rgba(200,255,62,0.04))`,border:`2px solid ${C.accent}55`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",position:"relative"}}>
                      {!avatarInput&&<span style={{fontFamily:"'Oswald',sans-serif",fontSize:32,fontWeight:700,color:C.accent}}>{initialsVal}</span>}
                      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity 0.2s"}} className="avatar-hover">
                        <span style={{fontSize:20}}>📷</span>
                      </div>
                    </div>
                    <div style={{position:"absolute",bottom:-6,right:-6,width:22,height:22,borderRadius:2,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>avatarRef.current&&avatarRef.current.click()}>
                      <span style={{fontSize:11}}>✎</span>
                    </div>
                    <input ref={avatarRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleAvatarUpload(e.target.files[0]);}} />
                  </div>

                  <div style={{flex:1}}>
                    {editingName ? (
                      <div>
                        <input className="profile-input" value={nameInput} onChange={e=>setNameInput(e.target.value)} placeholder="Seu nome de guerra..." style={{width:"100%",background:"#0a0c08",border:`1px solid ${C.accent}55`,borderRadius:3,padding:"8px 12px",color:C.text,fontSize:18,fontFamily:"'Oswald',sans-serif",letterSpacing:1,fontWeight:600,marginBottom:6}} autoFocus onKeyDown={e=>{if(e.key==="Enter")saveProfile();}} />
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={saveProfile} style={{flex:1,background:C.accent,border:"none",borderRadius:2,padding:"6px",fontSize:11,fontWeight:800,color:"#000",cursor:"pointer",fontFamily:"'Oswald',sans-serif",letterSpacing:1}}>SALVAR</button>
                          <button onClick={()=>setEditingName(false)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:2,padding:"6px 10px",fontSize:11,color:C.muted,cursor:"pointer"}}>✕</button>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                          <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:26,fontWeight:700,color:C.text,letterSpacing:1,lineHeight:1}}>{displayNameVal.toUpperCase()}</div>
                          <button onClick={()=>setEditingName(true)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:2,padding:"3px 8px",fontSize:10,color:C.muted2,cursor:"pointer",fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif"}}>✎ EDITAR</button>
                        </div>
                        <div style={{fontSize:10,color:C.muted2,letterSpacing:1}}>Membro desde {memberSince}</div>
                      </div>
                    )}
                  </div>
                </div>

                {/* XP BAR */}
                <div style={{background:"#0a0c08",border:`1px solid ${C.border}`,borderRadius:4,padding:"12px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:16}}>🛡️</span>
                      <span style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:18,color:C.accent,fontWeight:700,letterSpacing:2}}>LVL {levelAll}</span>
                      <span style={{fontSize:10,color:C.muted2,fontWeight:700,letterSpacing:1}}>DISCIPLINA</span>
                    </div>
                    <span style={{fontSize:10,color:C.muted2}}>{xpInLvl} / 500 XP</span>
                  </div>
                  <div style={{height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${(xpInLvl/500)*100}%`,background:`linear-gradient(90deg,${C.accent},#9dcc00)`,borderRadius:3,transition:"width 0.8s ease"}} />
                  </div>
                  <div style={{fontSize:9,color:C.muted,marginTop:6,letterSpacing:1}}>{totalWorkoutsAll} TREINOS FINALIZADOS · {totalXpAll} XP TOTAL</div>
                </div>
              </div>
            </div>

            <div style={{padding:"16px",animation:"fadeUp 0.4s ease"}}>

              {/* ── AVISO CORPO ── */}
              {!hasBodyData && (
                <div style={{marginBottom:16,background:`linear-gradient(135deg,rgba(200,255,62,0.06),rgba(200,255,62,0.02))`,border:`1px solid ${C.accent}44`,borderRadius:4,padding:"14px 16px",position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${C.accent},transparent)`}} />
                  <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                    <span style={{fontSize:24,flexShrink:0}}>🤖</span>
                    <div>
                      <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:C.accent,textTransform:"uppercase",marginBottom:4}}>FORGE AI PRECISA DE VOCÊ</div>
                      <div style={{fontSize:13,color:C.muted2,lineHeight:1.6}}>Adicione seu <span style={{color:C.text,fontWeight:700}}>peso</span> e <span style={{color:C.text,fontWeight:700}}>altura</span> abaixo para que a IA consiga avaliar suas cargas em relação ao seu biotipo e personalizar ainda mais as recomendações de treino.</div>
                    </div>
                  </div>
                </div>
              )}

              {/* ── DADOS CORPORAIS ── */}
              <div style={{marginBottom:14}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:3,color:C.accentText,textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
                  <span>DADOS CORPORAIS</span>
                  {hasBodyData&&<span style={{fontSize:9,background:C.accentDim,border:`1px solid ${C.accent}44`,color:C.accentText,padding:"2px 8px",borderRadius:2}}>IA ATIVA ✓</span>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  {/* Peso */}
                  <div style={{background:C.bgCard,border:`1px solid ${profile?.weight?C.accent+"44":C.border}`,borderRadius:4,padding:"12px 14px",position:"relative"}}>
                    {profile?.weight&&<div style={{position:"absolute",top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,${C.accent},transparent)`}} />}
                    <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.muted2,textTransform:"uppercase",marginBottom:6}}>PESO</div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:4,marginBottom:8}}>
                      <input className="profile-input" type="number" min="30" max="300" value={weightInput} onChange={e=>setWeightInput(e.target.value)} placeholder="—" style={{width:"100%",background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:weightInput?C.accent:C.muted,fontFamily:"'Oswald',Impact,sans-serif",fontSize:28,fontWeight:700,letterSpacing:1,padding:"0 0 4px",textAlign:"left",outline:"none"}} />
                      <span style={{fontSize:11,color:C.muted2,marginBottom:6,flexShrink:0}}>kg</span>
                    </div>
                    {profile?.weight&&<div style={{fontSize:9,color:C.muted2}}>Atual: {profile.weight}kg</div>}
                  </div>
                  {/* Altura */}
                  <div style={{background:C.bgCard,border:`1px solid ${profile?.height?C.accent+"44":C.border}`,borderRadius:4,padding:"12px 14px",position:"relative"}}>
                    {profile?.height&&<div style={{position:"absolute",top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,${C.accent},transparent)`}} />}
                    <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.muted2,textTransform:"uppercase",marginBottom:6}}>ALTURA</div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:4,marginBottom:8}}>
                      <input className="profile-input" type="number" min="100" max="250" value={heightInput} onChange={e=>setHeightInput(e.target.value)} placeholder="—" style={{width:"100%",background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:heightInput?C.accent:C.muted,fontFamily:"'Oswald',Impact,sans-serif",fontSize:28,fontWeight:700,letterSpacing:1,padding:"0 0 4px",textAlign:"left",outline:"none"}} />
                      <span style={{fontSize:11,color:C.muted2,marginBottom:6,flexShrink:0}}>cm</span>
                    </div>
                    {profile?.height&&<div style={{fontSize:9,color:C.muted2}}>Atual: {profile.height}cm</div>}
                  </div>
                </div>

                <button onClick={saveProfile} disabled={savingProfile} style={{width:"100%",marginTop:10,background:C.accent,color:"#000",border:"none",borderRadius:3,padding:"14px",fontSize:14,fontWeight:800,letterSpacing:2,cursor:savingProfile?"default":"pointer",fontFamily:"'Oswald',sans-serif",opacity:savingProfile?0.6:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  {savingProfile?"SALVANDO...":profileMsg||"SALVAR DADOS"}
                </button>
              </div>

              {/* ── ESTATÍSTICAS ── */}
              <div style={{marginBottom:14}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:3,color:C.accentText,textTransform:"uppercase",marginBottom:12}}>ESTATÍSTICAS</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                  {[
                    {label:"TREINOS",value:totalWorkoutsAll,icon:"🏋️"},
                    {label:"SEMANAS",value:streakWeeks,icon:"🔥",suffix:" streak"},
                    {label:"CONSISTÊNCIA",value:consistencyPct+"%",icon:"📊"},
                  ].map((s,i)=>(
                    <div key={i} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:4,padding:"10px 10px 12px",textAlign:"center"}}>
                      <div style={{fontSize:18,marginBottom:4}}>{s.icon}</div>
                      <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:20,color:C.accent,fontWeight:700,letterSpacing:1,lineHeight:1}}>{s.value}</div>
                      <div style={{fontSize:8,fontWeight:700,letterSpacing:1,color:C.muted2,textTransform:"uppercase",marginTop:4}}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </div>

                <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:4,padding:"10px 12px"}}>
                  <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.muted2,textTransform:"uppercase",marginBottom:4}}>ENERGIA DO CORPO</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                    <span style={{fontSize:16}}>⚡</span>
                    <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:22,color:todayEnergy?C.accent:C.muted2,fontWeight:700}}>{Math.round(energyPct)}%</div>
                  </div>
                  <div style={{fontSize:9,color:C.muted2,marginBottom:4}}>{todayEnergy?ENERGY_OPTIONS.find(e=>e.value===todayEnergy)?.label:"Boa energia para treinar"}</div>
                  <div style={{display:"flex",gap:2}}>
                    {Array.from({length:10},(_,i)=>(
                      <div key={i} style={{flex:1,height:5,background:i<Math.round(energyPct/10)?C.accent:C.border,borderRadius:1}} />
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* MENU OVERLAY */}
          {menuOpen&&<div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,zIndex:150}} />}
