    function formatDate(iso) {
      const d = new Date(iso+"T00:00:00");
      return d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});
    }
    function getWeekKey(dateISO) {
      const d = new Date((dateISO||todayISO())+"T00:00:00");
      const jan4 = new Date(d.getFullYear(),0,4);
      const week = Math.ceil(((d-jan4)/86400000+jan4.getDay()+1)/7);
      return d.getFullYear()+"-W"+String(week).padStart(2,"0");
    }
    function getProgression(exName, currentSets, history) {
      for (let i=0;i<history.length;i++) {
        const entry = history[i];
        const found = entry.exercises.find(e=>e.name===exName);
        if (found) {
          const prevVol  = found.sets.reduce((a,s)=>a+(s.reps*s.weight),0);
          const currVol  = currentSets.reduce((a,s)=>a+(s.reps*s.weight),0);
          const prevMax  = Math.max(...found.sets.map(s=>s.weight));
          const currMax  = Math.max(...currentSets.map(s=>s.weight));
          if (currMax>prevMax) return {type:"up",diff:currMax-prevMax,diffVolume:currVol-prevVol};
          if (currMax<prevMax) return {type:"down",diff:prevMax-currMax,diffVolume:currVol-prevVol};
          if (currVol>prevVol) return {type:"volume_up",diffVolume:currVol-prevVol};
          if (currVol<prevVol) return {type:"volume_down",diffVolume:prevVol-currVol};
          return {type:"equal"};
        }
      }
      return null;
    }
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX=800; let w=img.width, h=img.height;
          if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          callback(canvas.toDataURL("image/jpeg",0.7).split(",")[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── SVG HEXAGON ──
    function Hexagon({size=48, fill="transparent", stroke=C.border, strokeWidth=1.5, children, style={}, onClick}) {
      const s = size;
      const w = s;
      const h = s * 1.1547;
      // flat-top hexagon points
      const pts = [
        [w*0.25,0],[w*0.75,0],[w,h*0.5],[w*0.75,h],[w*0.25,h],[0,h*0.5]
      ].map(p=>p.join(",")).join(" ");
      return (
        <div onClick={onClick} style={{position:"relative",width:w,height:h,flexShrink:0,...style,cursor:onClick?"pointer":"default"}}>
          <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",top:0,left:0}}>
            <polygon points={pts} fill={fill} stroke={stroke} strokeWidth={strokeWidth}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {children}
          </div>
        </div>
      );
    }

            </button>
            {!isLast&&(
              <button onClick={onDone} style={{width:"100%",marginTop:12,background:"transparent",border:"none",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",padding:"8px"}}>Pular introdução</button>
            )}
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════
    //  MAIN APP
    // ════════════════════════════════════════════════════════════
    function GymLog({user, onSignOut}) {
      const [workouts,   setWorkouts]   = useState({});
      const [history,    setHistory]    = useState([]);
      const [feelings,   setFeelings]   = useState({});
      const [weekPhotos, setWeekPhotos] = useState({});

      const [saving,     setSaving]     = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [bottomTab,  setBottomTab]  = useState("inicio");
      const [exerciseName, setExerciseName] = useState("");
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);
      const [timerOpen,    setTimerOpen]    = useState(false);
      const [sets,       setSets]       = useState([{reps:"",weight:""}]);
      const [aiReport,   setAiReport]   = useState("");
      const [aiLoading,  setAiLoading]  = useState(false);
      const [aiError,    setAiError]    = useState("");
      const [todayEnergy,setTodayEnergy]= useState(null);
      const [todayResult,setTodayResult]= useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput,    setChatInput]    = useState("");
      const [chatLoading,  setChatLoading]  = useState(false);
      const [profile,      setProfile]      = useState(null);
      const [menuOpen,     setMenuOpen]     = useState(false);
      const [showMigrate,  setShowMigrate]  = useState(false);
      const [migrating,    setMigrating]    = useState(false);
      const chatEndRef = useRef(null);

      const currentWeekKey = getWeekKey(todayISO());
      const currentPhotos  = weekPhotos[currentWeekKey] || {};

      useEffect(()=>{
        const hasLocal = localStorage.getItem("gymlog-workouts-v1")||localStorage.getItem("gymlog-history-v1")||localStorage.getItem("gymlog-feelings-v1")||localStorage.getItem("gymlog-photos-v1");
        if(hasLocal) setShowMigrate(true);
      },[]);

      const runMigration = async () => {
        if(migrating) return;
        setMigrating(true);
        try {
          const rawW=localStorage.getItem("gymlog-workouts-v1");
          if(rawW){const wData=JSON.parse(rawW);for(const dayKey of Object.keys(wData)){if(wData[dayKey]&&wData[dayKey].length>0)await db.saveWorkout(user.id,dayKey,wData[dayKey]);}}
          const rawH=localStorage.getItem("gymlog-history-v1");
          if(rawH){const hData=JSON.parse(rawH);for(const entry of hData)await db.saveHistory(user.id,entry.date,entry.day,entry.exercises);}
          const rawF=localStorage.getItem("gymlog-feelings-v1");
          if(rawF){const fData=JSON.parse(rawF);for(const date of Object.keys(fData)){const f=fData[date];await db.saveFeeling(user.id,date,f.energy||null,f.result||null);}}
          const rawP=localStorage.getItem("gymlog-photos-v1");
          if(rawP){const pData=JSON.parse(rawP);for(const weekKey of Object.keys(pData)){const photos=pData[weekKey];if(photos.front)await db.savePhoto(user.id,weekKey,"front",photos.front);if(photos.side)await db.savePhoto(user.id,weekKey,"side",photos.side);if(photos.back)await db.savePhoto(user.id,weekKey,"back",photos.back);}}
          localStorage.removeItem("gymlog-workouts-v1");localStorage.removeItem("gymlog-history-v1");localStorage.removeItem("gymlog-feelings-v1");localStorage.removeItem("gymlog-photos-v1");
          setShowMigrate(false);await loadAll();alert("✅ Dados migrados com sucesso!");
        } catch(e){alert("❌ Erro na migração: "+e.message);}
        setMigrating(false);
      };

      useEffect(()=>{ loadAll(); },[]);
      useEffect(()=>{ if(!timerRunning)return; const t=setInterval(()=>setTimerSeconds(s=>s+1),1000); return()=>clearInterval(t); },[timerRunning]);
      useEffect(()=>{ const today=todayISO(); if(feelings[today]){setTodayEnergy(feelings[today].energy||null);setTodayResult(feelings[today].result||null);}else{setTodayEnergy(null);setTodayResult(null);} },[feelings]);
      useEffect(()=>{ if(chatEndRef.current)chatEndRef.current.scrollIntoView({behavior:"smooth"}); },[chatMessages]);

      const loadAll = async () => {
        try {
          const [w,h,f,p,prof]=await Promise.all([db.getWorkouts(user.id),db.getHistory(user.id),db.getFeelings(user.id),db.getPhotos(user.id),db.getProfile(user.id)]);
          setWorkouts(w);setHistory(h);setFeelings(f);setWeekPhotos(p);setProfile(prof);
          const today=todayISO();
          if(f[today]){setTodayEnergy(f[today].energy||null);setTodayResult(f[today].result||null);}
        } catch(e){console.error(e);}
        setLoading(false);
      };

      const saveWorkoutFn = async (dayKey, exercises) => {
        setSaving(true);
        try{await db.saveWorkout(user.id,dayKey,exercises);}catch(e){}
        setTimeout(()=>setSaving(false),600);
      };

      const saveEnergy = async (value) => {
        const today=todayISO(); const cur=feelings[today]||{};
        const upd={...feelings,[today]:{...cur,energy:value}};
        setFeelings(upd);setTodayEnergy(value);
        await db.saveFeeling(user.id,today,value,cur.result||null);
        setModal(null);
      };

      const saveResult = async (value) => {
        const today=todayISO(); const cur=feelings[today]||{};
        const upd={...feelings,[today]:{...cur,result:value}};
        setFeelings(upd);setTodayResult(value);
        await db.saveFeeling(user.id,today,cur.energy||null,value);
        setModal(null);
        await doFinishWorkout();
      };

      const doFinishWorkout = async () => {
        const exs=workouts[activeDay]||[];
        if(exs.length===0)return;
        const today=todayISO();
        await db.saveHistory(user.id,today,activeDay,exs);
        const entry={date:today,day:activeDay,exercises:exs};
        setHistory(prev=>[entry,...prev.filter(h=>!(h.date===today&&h.day===activeDay))]);
        alert("✅ Treino salvo no histórico!");
      };

      const finishWorkout = () => {
        const exs=workouts[activeDay]||[];
        if(exs.length===0)return;
        if(!todayEnergy)setModal("energy_then_result");
        else setModal("result");
      };

      const handlePhotoUpload = (slot, file) => {
        if(!file)return;
        compressImage(file, async(base64)=>{
          const upd={...weekPhotos,[currentWeekKey]:{...currentPhotos,[slot]:base64}};
          setWeekPhotos(upd);
          await db.savePhoto(user.id,currentWeekKey,slot,base64);
        });
      };

      const removePhoto = async (slot) => {
        const upd={...weekPhotos};
        if(upd[currentWeekKey]){upd[currentWeekKey]={...upd[currentWeekKey]};delete upd[currentWeekKey][slot];}
        setWeekPhotos(upd);
        await db.removePhoto(user.id,currentWeekKey,slot);
      };

      const buildAIContext = (photos) => {
        const sevenDaysAgo=new Date();sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
        const recent=history.filter(h=>new Date(h.date+"T00:00:00")>=sevenDaysAgo);
        const older=history.filter(h=>new Date(h.date+"T00:00:00")<sevenDaysAgo);
        const comparativo=[];
        recent.forEach(entry=>{
          entry.exercises.forEach(ex=>{
            let anterior=null;
            for(let i=0;i<older.length;i++){const f=older[i].exercises.find(e=>e.name===ex.name);if(f){anterior={data:older[i].date,sets:f.sets};break;}}
            const cV=ex.sets.reduce((a,s)=>a+(s.reps*s.weight),0);const cM=Math.max(...ex.sets.map(s=>s.weight));const cR=ex.sets.reduce((a,s)=>a+s.reps,0);
            const item={exercicio:ex.name,dia:entry.day,data:entry.date,series_esta_semana:ex.sets.map((s,i)=>`S${i+1}: ${s.reps}rep x ${s.weight}kg`),volume_total_kg:cV,carga_maxima_kg:cM,total_repeticoes:cR};
            if(anterior){const pV=anterior.sets.reduce((a,s)=>a+(s.reps*s.weight),0);const pM=Math.max(...anterior.sets.map(s=>s.weight));const pR=anterior.sets.reduce((a,s)=>a+s.reps,0);item.ultima_vez=anterior.data;item.series_anterior=anterior.sets.map((s,i)=>`S${i+1}: ${s.reps}rep x ${s.weight}kg`);item.variacao_carga_kg=cM-pM;item.variacao_volume_kg=cV-pV;item.variacao_repeticoes=cR-pR;item.status=cM>pM?"PROGREDIU CARGA":cM<pM?"REGREDIU CARGA":cV>pV?"MAIS VOLUME (mesma carga)":cV<pV?"MENOS VOLUME":"IGUAL";}else{item.status="PRIMEIRO REGISTRO";}
            comparativo.push(item);
          });
        });
        const feelingsData=[];
        Object.keys(feelings).forEach(date=>{const d=new Date(date+"T00:00:00");if(d>=sevenDaysAgo){const eO=ENERGY_OPTIONS.find(e=>e.value===feelings[date].energy);const rO=RESULT_OPTIONS.find(r=>r.value===feelings[date].result);feelingsData.push({data:date,disposicao:eO?eO.emoji+" "+eO.label:"não registrado",resultado:rO?rO.emoji+" "+rO.label:"não registrado"});}});
        const hasPhotos=photos&&(photos.front||photos.side||photos.back);
        const systemPrompt="Você é um personal trainer experiente e nutricionista esportivo. O atleta é NATURAL. Analise os dados de treino"+(hasPhotos?" e as fotos enviadas":"")+". Seja direto, motivador e técnico. Use linguagem informal mas profissional.";
        const textContent="COMPARATIVO DE EXERCÍCIOS:\n"+JSON.stringify(comparativo,null,2)+"\n\nDISPOSIÇÃO E RESULTADO:\n"+JSON.stringify(feelingsData,null,2)+(hasPhotos?"\n\nFOTOS DO FÍSICO: "+[photos.front?"FRENTE":null,photos.side?"PERFIL":null,photos.back?"COSTAS":null].filter(Boolean).join(", "):"\n\n(Sem fotos)")+"\n\nAnalise progressão, disposição, e dê 2-3 recomendações práticas. Responda em português brasileiro.";
        return{systemPrompt,textContent};
      };

      const generateAIReport = async () => {
        const apiUrl=window.AI_API_URL;
        setAiLoading(true);setAiError("");setAiReport("");setChatMessages([]);
        try{
          const photos=weekPhotos[currentWeekKey]||{};const{systemPrompt,textContent}=buildAIContext(photos);const hasPhotos=photos.front||photos.side||photos.back;
          const userContent=[];
          if(hasPhotos){if(photos.front)userContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.front}});if(photos.side)userContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.side}});if(photos.back)userContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.back}});}
          userContent.push({type:"text",text:textContent});
          const res=await fetch(apiUrl+"analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:systemPrompt,messages:[{role:"user",content:userContent}]})});
          if(!res.ok){const err=await res.json();throw new Error(err.error?.message||"Erro na API");}
          const data=await res.json();const text=data.content&&data.content[0]?data.content[0].text:"Sem resposta.";
          setAiReport(text);setChatMessages([{role:"assistant",content:text}]);
        }catch(e){setAiError("❌ Erro: "+e.message);}
        setAiLoading(false);
      };

      const sendChatMessage = async () => {
        const msg=chatInput.trim();if(!msg||chatLoading)return;
        const apiUrl=window.AI_API_URL;const newMessages=[...chatMessages,{role:"user",content:msg}];
        setChatMessages(newMessages);setChatInput("");setChatLoading(true);
        try{
          const photos=weekPhotos[currentWeekKey]||{};const{systemPrompt,textContent}=buildAIContext(photos);const hasPhotos=photos.front||photos.side||photos.back;
          const firstUserContent=[];
          if(hasPhotos){if(photos.front)firstUserContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.front}});if(photos.side)firstUserContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.side}});if(photos.back)firstUserContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photos.back}});}
          firstUserContent.push({type:"text",text:textContent});
          const apiMessages=[{role:"user",content:firstUserContent},{role:"assistant",content:chatMessages[0]?chatMessages[0].content:"Entendido, analisei seus dados."},...newMessages.slice(1).map(m=>({role:m.role,content:m.content}))];
          const res=await fetch(apiUrl+"analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:systemPrompt,messages:apiMessages})});
          if(!res.ok)throw new Error("Erro na API");
          const data=await res.json();const text=data.content&&data.content[0]?data.content[0].text:"Sem resposta.";
          setChatMessages(prev=>[...prev,{role:"assistant",content:text}]);
        }catch(e){setChatMessages(prev=>[...prev,{role:"assistant",content:"❌ Erro: "+e.message}]);}
        setChatLoading(false);
      };

      // ── EXERCISE CRUD ──
      const dayExercises = workouts[activeDay]||[];
      const currentDay   = ALL_DAYS.find(d=>d.key===activeDay)||DAYS[0];
      const todayKey     = getTodayKey()==="dom"?"seg":getTodayKey();

      const openAdd  = () => { setEditId(null);setExerciseName("");setSets([{reps:"",weight:""}]);setModal("add"); };
      const openEdit = ex => { setEditId(ex.id);setExerciseName(ex.name);setSets(ex.sets.map(s=>({reps:String(s.reps),weight:String(s.weight)})));setModal("edit"); };
      const closeModal = () => { setModal(null);setEditId(null); };
      const addSet    = () => setSets(p=>[...p,{reps:"",weight:""}]);
      const removeSet = i  => { if(sets.length>1)setSets(sets.filter((_,idx)=>idx!==i)); };
      const updateSet = (i,field,val) => { const n=[...sets];n[i]={...n[i],[field]:val};setSets(n); };

      const saveExercise = async () => {
        if(!exerciseName.trim())return;
        const validSets=sets.filter(s=>s.reps!==""&&s.weight!=="").map(s=>({reps:Number(s.reps),weight:Number(s.weight)}));
        if(validSets.length===0)return;
        const updated={...workouts};const list=[...(updated[activeDay]||[])];
        if(editId){const idx=list.findIndex(e=>e.id===editId);if(idx!==-1)list[idx]={id:editId,name:exerciseName.trim(),sets:validSets};}
        else{list.push({id:String(Date.now()),name:exerciseName.trim(),sets:validSets});}
        updated[activeDay]=list;setWorkouts(updated);
        await saveWorkoutFn(activeDay,list);closeModal();

      const confirmDelete = async (id) => {
        const updated={...workouts};updated[activeDay]=(updated[activeDay]||[]).filter(e=>e.id!==id);
        setWorkouts(updated);await saveWorkoutFn(activeDay,updated[activeDay]);setDeleteConfirm(null);
      };

      // ── STATS COMPUTATION ──
      const totalVolume = history.slice(0,20).reduce((acc,entry)=>acc+entry.exercises.reduce((a,ex)=>a+ex.sets.reduce((b,s)=>b+(s.reps*s.weight),0),0),0);
      const weekDaysWithHistory = DAYS.filter(d=>history.some(h=>getWeekKey(h.date)===currentWeekKey&&h.day===d.key));
      const consistencyPct = Math.round((weekDaysWithHistory.length/6)*100);
      const weekHasHistory = history.some(h=>getWeekKey(h.date)===currentWeekKey);

      // XP calc
      const totalWorkouts = history.length;
      const xpPerWorkout = 120;
      const totalXp = totalWorkouts * xpPerWorkout;
      const xpPerLevel = 500;
      const level = Math.floor(totalXp/xpPerLevel)+1;
      const xpInLevel = totalXp % xpPerLevel;
      const energyPct = todayEnergy ? (todayEnergy/5)*100 : 60;

      // streak weeks
      const streakWeeks = (() => {
        let streak=0;
        for(let w=0;w<52;w++){
          const d=new Date();d.setDate(d.getDate()-w*7);
          const wk=getWeekKey(d.toISOString().slice(0,10));
          const hasWorkout=history.some(h=>getWeekKey(h.date)===wk);
          if(hasWorkout)streak++;else if(w>0)break;

        return streak;

      if(loading) return (
        <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>

          <div style={{fontSize:11,letterSpacing:4,color:C.muted2,textTransform:"uppercase"}}>Carregando...</div>
        </div>
      );

        history.forEach(h=>{ if(!grouped[h.date])grouped[h.date]=[]; grouped[h.date].push(h); });

        const weekKeys=Object.keys(weekPhotos).sort((a,b)=>b.localeCompare(a));

                </div>

                <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:28,letterSpacing:3,color:C.accent,fontWeight:700}}>ANÁLISES</div>
                <button onClick={()=>{setAiReport("");setAiError("");setChatMessages([]);setModal("ai");}} style={{background:`linear-gradient(135deg,#1a0f2e,${C.bgCard2})`,border:`1px solid ${C.purple}55`,color:C.purple,borderRadius:3,padding:"8px 14px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>🤖 FORGE AI</button>
              </div>
            </div>
            <div style={{padding:"16px",paddingBottom:40}}>

                  <div key={wk} style={{marginBottom:16}}>
                    <div style={{fontSize:10,fontWeight:700,letterSpacing:1,color:wk===currentWeekKey?C.accent:C.muted2,textTransform:"uppercase",marginBottom:8}}>

                      <div key={i} style={{flex:1,height:5,background:i<Math.round(energyPct/10)?C.accent:C.border,borderRadius:1}} />
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* MENU OVERLAY */}
          {menuOpen&&<div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,zIndex:150}} />}

          {/* Modals */}
          {renderModals()}

          {/* TIMER FAB */}
          <button onClick={()=>setTimerOpen(o=>!o)} style={{position:"fixed",bottom:84,right:14,zIndex:100,width:46,height:46,borderRadius:2,background:timerRunning?C.accent:C.bgCard,border:`1px solid ${timerRunning?C.accent:C.border}`,color:timerRunning?"#000":C.muted2,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s",boxShadow:timerRunning?`0 0 16px ${C.accent}66`:"none"}}>⏱</button>
          {timerOpen&&(
            <div style={{position:"fixed",bottom:140,right:14,zIndex:100,background:C.bgCard,border:`1px solid ${timerRunning?C.accent+"66":C.border}`,borderRadius:4,padding:"16px 18px 14px",boxShadow:"0 8px 32px rgba(0,0,0,0.8)",minWidth:170,textAlign:"center"}}>
              <div style={{position:"absolute",top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,${timerRunning?C.accent:C.border},transparent)`}} />
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.muted,textTransform:"uppercase"}}>CRONÔMETRO</span>
                <button onClick={()=>setTimerOpen(false)} style={{background:"transparent",border:"none",color:C.muted,fontSize:14,cursor:"pointer"}}>✕</button>
              </div>
              <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:46,letterSpacing:3,color:timerRunning?C.accent:C.text,lineHeight:1,marginBottom:12,fontWeight:700}}>
                {String(Math.floor(timerSeconds/60)).padStart(2,"0")}:{String(timerSeconds%60).padStart(2,"0")}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setTimerRunning(r=>!r)} style={{flex:1,background:timerRunning?C.redDim:C.accentDim,border:`1px solid ${timerRunning?C.red+"66":C.accent+"66"}`,color:timerRunning?C.red:C.accentText,borderRadius:2,padding:"9px 0",fontSize:11,fontWeight:800,letterSpacing:1,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif"}}>{timerRunning?"⏸ PAUSA":"▶ INICIAR"}</button>
                <button onClick={()=>{setTimerSeconds(0);setTimerRunning(false);}} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:2,padding:"9px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif"}}>↺</button>
              </div>
            </div>
          )}

          {/* BOTTOM NAV */}
          <BottomNav active={bottomTab} onChange={(tab)=>{
            if(tab==="novo"){openAdd();return;}
            setBottomTab(tab);
          }} />
        </div>
      );
    }

    // ── BOTTOM NAV ──
    function BottomNav({active, onChange}) {
      const tabs = [
        {key:"inicio",   icon:"⚔️",  label:"INÍCIO"},
        {key:"exercicios",icon:"🏋️", label:"EXERCÍCIOS"},
        {key:"novo",     icon:"+",   label:"NOVO",    special:true},
        {key:"analises", icon:"📈",  label:"ANÁLISES"},
        {key:"perfil",   icon:"👤",  label:"PERFIL"},
      ];
      return (
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.bgCard,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:50,paddingBottom:"env(safe-area-inset-bottom)"}}>
          {tabs.map(tab=>{
            const isActive=active===tab.key;
            if(tab.special) return (
              <button key={tab.key} onClick={()=>onChange(tab.key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",cursor:"pointer",padding:"8px 4px 10px",position:"relative",top:-12}}>
                <div style={{width:50,height:50,borderRadius:"50%",background:C.accent,border:`3px solid ${C.bg}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 20px ${C.accent}66`}}>
                  <span style={{fontFamily:"'Oswald',sans-serif",fontSize:26,fontWeight:700,color:"#000",lineHeight:1}}>+</span>
                </div>
                <span style={{fontSize:8,fontWeight:700,letterSpacing:1,color:C.accent,marginTop:4}}>{tab.label}</span>
              </button>
            );
            return (
              <button key={tab.key} onClick={()=>onChange(tab.key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",cursor:"pointer",padding:"10px 4px",borderTop:isActive?`2px solid ${C.accent}`:"2px solid transparent"}}>
                <span style={{fontSize:18,marginBottom:2,filter:isActive?"none":"grayscale(0.5)",opacity:isActive?1:0.5}}>{tab.icon}</span>
                <span style={{fontSize:8,fontWeight:700,letterSpacing:1,color:isActive?C.accent:C.muted,textTransform:"uppercase"}}>{tab.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    // ── ROOT CONTROLLER ──
    function App() {
      const [authState, setAuthState] = useState("loading");
      const [user, setUser] = useState(null);

      useEffect(()=>{
        sb.auth.getSession().then(({data:{session}})=>{
          if(session?.user){setUser(session.user);checkOnboarding(session.user);}
          else{setAuthState("auth");}
        });
        const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
          if(session?.user){setUser(session.user);if(_event==="SIGNED_IN")checkOnboarding(session.user);}
          else{setUser(null);setAuthState("auth");}
        });
        return()=>subscription.unsubscribe();
      },[]);

      const checkOnboarding = async (u) => {
        try{
          const createdAt=new Date(u.created_at);const now=new Date();
          const isNewUser=(now-createdAt)<30000;
          if(isNewUser){setAuthState("onboarding");}else{setAuthState("app");}
        }catch(e){setAuthState("app");}
      };

      if(authState==="loading") return (
        <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
          <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:36,color:C.accent,letterSpacing:6,fontWeight:700}}>IRON LOG</div>
          <div style={{fontSize:11,letterSpacing:4,color:C.muted2,textTransform:"uppercase"}}>Carregando...</div>
        </div>
      );
      if(authState==="auth")        return <AuthScreen onAuth={u=>{setUser(u);checkOnboarding(u);}} />;
      if(authState==="onboarding")  return <OnboardingScreen onDone={()=>setAuthState("app")} />;
      if(authState==="app"&&user)   return <GymLog user={user} onSignOut={()=>{setUser(null);setAuthState("auth");}} />;
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
