          {renderModals()}


          {/* BOTTOM NAV */}
         <BottomNav active={bottomTab} onChange={(tab)=>{setQuickMenuOpen(false);setMenuOpen(false);setBottomTab(tab);}} onPlusClick={()=>setQuickMenuOpen(true)} />
        </div>
      );
    }

    // ── AI ONBOARDING ──
    function AIOnboardingScreen({user, onDone}) {
      const [messages, setMessages] = useState([]);
      const [input, setInput]       = useState("");
      const [loading, setLoading]   = useState(false);
      const [done, setDone]         = useState(false);
      const [photoBase64, setPhotoBase64] = useState(null);
      const [askingPhoto, setAskingPhoto] = useState(false);
      const chatEndRef = useRef(null);
      const photoRef   = useRef(null);
      // Ref espelho do photoBase64 para evitar closure stale
      const photoBase64Ref = useRef(null);
    
      const SYSTEM_PROMPT = `Você é a FORGE AI, personal trainer digital do app IRON LOG.
    Seu objetivo é dar as boas vindas ao novo usuário e coletar informações para personalizar a experiência.
    Siga EXATAMENTE este roteiro em ordem, uma pergunta por mensagem:
    
    1. Dê boas vindas calorosas ao IRON LOG, apresente-se brevemente e pergunte o NOME do usuário.
    2. Pergunte há QUANTO TEMPO treina (iniciante, 6 meses, 1 ano, 2 anos, etc).
    3. Pergunte qual o OBJETIVO principal (hipertrofia, emagrecimento, força, condicionamento, saúde geral).
    4. Pergunte quantos DIAS POR SEMANA consegue treinar (mínimo 2, máximo 6).
    5. Pergunte se já tem uma DIVISÃO de treino definida (ex: ABC, ABCD, fullbody) ou se quer que você monte um treino personalizado para ele.
    
    Se o usuário quiser ajuda para montar o treino:
    - Responda com exatamente: [PRECISA_TREINO]
    - Aguarde — o sistema irá perguntar se ele quer enviar uma foto.
    - Após isso você receberá os dados e deverá montar o treino completo.
    
    Se o usuário JÁ TEM divisão definida:
    - Parabenize, diga que ele pode cadastrar os exercícios na seção EXERCÍCIOS.
    - Faça um resumo motivador do perfil e encerre com: [ONBOARDING_COMPLETO]
    
    REGRAS:
    - Mensagens curtas, máximo 3 linhas.
    - Uma pergunta por mensagem.
    - Linguagem informal e motivadora.
    - Não invente informações.`;
    
      const TREINO_PROMPT = `Você é um personal trainer experiente com base científica sólida.
    Monte um treino completo e detalhado para o atleta com base nas informações fornecidas.
    Responda APENAS com JSON puro, sem absolutamente nenhum texto antes ou depois, sem markdown, sem blocos de código, sem explicações.
    A resposta deve começar com [ e terminar com ].
    
    Formato EXATO (array de dias):
    [
      {
        "day_key": "seg",
        "exercises": [
          {
            "name": "Nome do Exercício",
            "sets": [
              {"reps": 12, "weight": 0},
              {"reps": 10, "weight": 0},
              {"reps": 8, "weight": 0}
            ]
          }
        ]
      }
    ]
    
    REGRAS OBRIGATÓRIAS:
    - Responda SOMENTE o JSON, começando com [ e terminando com ]
    - Use apenas os day_keys: seg, ter, qua, qui, sex, sab
    - Distribua exatamente a quantidade de dias informada pelo usuário
    - weight SEMPRE 0 em todas as séries (o usuário ajusta depois)
    - Cada exercício deve ter entre 3 e 4 sets com reps variando por set (ex: 12,10,10,8)
    - Mínimo 5 exercícios por dia, máximo 7
    - Adapte a divisão ao objetivo: hipertrofia=ABC ou ABCD, emagrecimento=fullbody ou push/pull, força=força+acessórios
    - Se tiver foto, estime composição corporal e adapte volume/intensidade`;
    
      useEffect(()=>{ startConversation(); },[]);
      useEffect(()=>{ if(chatEndRef.current)chatEndRef.current.scrollIntoView({behavior:"smooth"}); },[messages, askingPhoto]);
    
      const startConversation = async () => {
        setLoading(true);
        try {
          const res = await fetch(window.AI_API_URL+"analyze", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({system:SYSTEM_PROMPT, messages:[{role:"user",content:"iniciar"}]})
          });
          const data = await res.json();
          const text = data.content?.[0]?.text || "Olá! Bem-vindo ao IRON LOG! Qual é o seu nome?";
          setMessages([{role:"assistant",content:text}]);
        } catch(e){
          setMessages([{role:"assistant",content:"Olá! Bem-vindo ao IRON LOG! Qual é o seu nome?"}]);
        }
        setLoading(false);
      };
    
      // ─── CORREÇÃO BUG 4: recebe o array de mensagens como parâmetro ───
      // ─── CORREÇÃO BUG 2: recebe base64 diretamente, não usa estado ───
      const saveWorkoutsToSupabase = async (treino) => {
        const client = window._sb; // usa o cliente global diretamente
        for (const dia of treino) {
          if (!dia.day_key || !Array.isArray(dia.exercises) || dia.exercises.length === 0) continue;
          const exercises = dia.exercises.map(ex => ({
            id: String(Date.now() + Math.random()),
            name: ex.name || "Exercício",
            sets: Array.isArray(ex.sets) && ex.sets.length > 0
              ? ex.sets.map(s => ({ reps: Number(s.reps) || 10, weight: 0 }))
              : [{ reps: 12, weight: 0 }, { reps: 10, weight: 0 }, { reps: 10, weight: 0 }]
          }));
          // ─── CORREÇÃO BUG 3: checa o erro do Supabase corretamente ───
          const { error } = await client
            .from("workouts")
            .upsert(
              { user_id: user.id, day_key: dia.day_key, exercises: exercises },
              { onConflict: "user_id,day_key" }
            );
          if (error) {
            console.error("Erro Supabase dia " + dia.day_key + ":", error.message, error.details, error.hint);
            // Tenta insert puro como fallback se upsert falhar
            const { error: insertError } = await client
              .from("workouts")
              .insert({ user_id: user.id, day_key: dia.day_key, exercises: exercises });
            if (insertError) {
              console.error("Fallback insert também falhou:", insertError.message);
            }
          }
        }
      };
    
      const extractAndSaveProfile = async (allMessages, goal) => {
        try {
          const extractRes = await fetch(window.AI_API_URL+"analyze", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              system: `Extraia dados de uma conversa e responda APENAS com JSON puro sem markdown.
    Formato: {"nome":"...","tempo_treino":"...","objetivo":"...","dias_semana":0,"divisao":"..."}`,
              messages:[{role:"user", content:"Extraia os dados:\n\n"+allMessages.map(m=>`${m.role==="user"?"Usuário":"IA"}: ${m.content}`).join("\n")}]
            })
          });
          const extractData = await extractRes.json();
          const rawText = extractData.content?.[0]?.text || "{}";
          const clean = rawText.replace(/```json|```/g,"").trim();
          const parsed = JSON.parse(clean);
          await window._sb.from("profiles").upsert({
            id: user.id,
            display_name: parsed.nome || null,
            goal: goal || parsed.objetivo || null,
            onboarding_data: parsed
          }, {onConflict:"id"});
          // Salva resumo do onboarding na memória
          const onbSummary = [
            parsed.nome       ? `Nome: ${parsed.nome}`                       : null,
            parsed.objetivo   ? `Objetivo: ${parsed.objetivo}`               : null,
            parsed.tempo_treino? `Experiência: ${parsed.tempo_treino}`       : null,
            parsed.dias_semana ? `Dias/semana: ${parsed.dias_semana}`        : null,
            parsed.divisao    ? `Divisão preferida: ${parsed.divisao}`       : null,
          ].filter(Boolean).join(". ");
          if(onbSummary) {
            await window._sb.from("ai_memory").insert({
              user_id: user.id, source:"onboarding", summary: onbSummary
            });
          }
        } catch(e){ console.error("Erro ao salvar perfil:", e); }
      };
    
      // ─── CORREÇÃO BUG 2 + 4: recebe snapshotMessages e base64Direto como parâmetros ───
      const buildTreino = async (snapshotMessages, withPhoto, base64Direto) => {
        try {
          const conversaTexto = snapshotMessages
            .map(m => `${m.role === "user" ? "Usuário" : "IA"}: ${m.content}`)
            .join("\n");
    
          const userContent = [];
          // Usa base64Direto (parâmetro) em vez do estado React, eliminando closure stale
          if (withPhoto && base64Direto) {
            userContent.push({
              type: "image",
              source: { type: "base64", media_type: "image/jpeg", data: base64Direto }
            });
          }
          userContent.push({ type: "text", text: `Monte o treino com base nesta conversa:\n\n${conversaTexto}` });
    
          const res = await fetch(window.AI_API_URL + "analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ system: TREINO_PROMPT, messages: [{ role: "user", content: userContent }] })
          });
    
          if (!res.ok) {
            console.error("API respondeu com erro:", res.status);
            return 0;
          }
    
          const data = await res.json();
          const rawText = (data.content?.[0]?.text || "").trim();
    
          // Extrai somente o JSON mesmo que venha com texto antes/depois
          const jsonMatch = rawText.match(/\[[\s\S]*\]/);
          if (!jsonMatch) {
            console.error("IA não retornou JSON válido. Resposta:", rawText);
            return 0;
          }
    
          let treino;
          try {
            treino = JSON.parse(jsonMatch[0]);
          } catch (parseErr) {
            console.error("Falha ao fazer parse do JSON:", jsonMatch[0]);
            return 0;
          }
    
          if (!Array.isArray(treino) || treino.length === 0) {
            console.error("JSON veio vazio ou não é array:", treino);
            return 0;
          }
    
          await saveWorkoutsToSupabase(treino);
          return treino.length;
        } catch (e) {
          console.error("Erro geral buildTreino:", e.message);
          return 0;
        }
      };
    
      const sendMessage = async () => {
        const msg = input.trim();
        if(!msg || loading) return;
        const newMessages = [...messages, {role:"user", content:msg}];
        setMessages(newMessages);
        setInput("");
        setLoading(true);
    
        try {
          const res = await fetch(window.AI_API_URL+"analyze", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({system:SYSTEM_PROMPT, messages:newMessages.map(m=>({role:m.role,content:m.content}))})
          });
          const data = await res.json();
          const text = data.content?.[0]?.text || "";
    
          if(text.includes("[PRECISA_TREINO]")) {
            const goalMsg = newMessages.find(m=>m.role==="user" && (
              m.content.toLowerCase().includes("hipertrofia")||
              m.content.toLowerCase().includes("emagrecimento")||
              m.content.toLowerCase().includes("força")||
              m.content.toLowerCase().includes("condicionamento")||
              m.content.toLowerCase().includes("saúde")
            ));
            await extractAndSaveProfile(newMessages, goalMsg?.content || null);
            setMessages(prev=>[...prev,{role:"assistant",content:"Ótimo! Vou montar um treino personalizado para você. 💪"}]);
            setAskingPhoto(true);
          } else if(text.includes("[ONBOARDING_COMPLETO]")) {
            const cleanText = text.replace("[ONBOARDING_COMPLETO]","").trim();
            setMessages(prev=>[...prev,{role:"assistant",content:cleanText}]);
            const goalMsg = newMessages.find(m=>m.role==="user" && (
              m.content.toLowerCase().includes("hipertrofia")||
              m.content.toLowerCase().includes("emagrecimento")||
              m.content.toLowerCase().includes("força")||
              m.content.toLowerCase().includes("condicionamento")||
              m.content.toLowerCase().includes("saúde")
            ));
            await extractAndSaveProfile(newMessages, goalMsg?.content || null);
            setDone(true);
          } else {
            setMessages(prev=>[...prev,{role:"assistant",content:text}]);
          }
        } catch(e){
          setMessages(prev=>[...prev,{role:"assistant",content:"❌ Erro de conexão. Tente novamente."}]);
        }
        setLoading(false);
      };
    
      const handlePhotoChoice = async (sendPhoto) => {
        setAskingPhoto(false);
        if(sendPhoto) {
          photoRef.current && photoRef.current.click();
        } else {
          // ─── CORREÇÃO BUG 4: passa snapshot atual de messages como parâmetro ───
          await finalizeTreino(false, null);
        }
      };
    
      const handlePhotoUpload = (file) => {
        if(!file) return;
        compressImage(file, async(base64) => {
          // Atualiza estado E ref para consistência
          setPhotoBase64(base64);
          photoBase64Ref.current = base64;
          // ─── CORREÇÃO BUG 2: passa base64 diretamente, não depende do setState ───
          await finalizeTreino(true, base64);
        });
      };
    
      // ─── CORREÇÃO BUG 4: captura snapshot de messages no momento da chamada ───
      const finalizeTreino = async (withPhoto, base64Direto) => {
        // Captura o snapshot ATUAL das mensagens antes de qualquer setState
        setMessages(prev => {
          const snapshotParaBuild = [...prev];
    
          const msgConfirmacao = withPhoto
            ? "Foto recebida! Montando seu treino personalizado... ⚙️"
            : "Sem problema! Montando seu treino com base nas suas informações... ⚙️";
    
          setLoading(true);
    
          // Executa o build com o snapshot correto e base64 direto (sem closure stale)
          buildTreino(snapshotParaBuild, withPhoto, base64Direto).then(diasCount => {
            setMessages(prev2 => [...prev2, {
              role: "assistant",
              content: diasCount > 0
                ? `Treino montado com sucesso! 🎉\n\nJá salvei ${diasCount} dias de treino na seção EXERCÍCIOS. Você pode ver, editar e ajustar as cargas por lá.\n\nBem-vindo ao IRON LOG! Vamos forjar seu progresso! ⚔️`
                : `Treino criado! Acesse a seção EXERCÍCIOS para ver seu plano. Vamos forjar seu progresso! ⚔️`
            }]);
            setLoading(false);
            setDone(true);
          });
    
          return [...prev, { role: "assistant", content: msgConfirmacao }];
        });
      };
    
      return (
        <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",fontFamily:"'Barlow Condensed',sans-serif",maxWidth:480,margin:"0 auto"}}>
          <style>{`@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&display=swap'); *{box-sizing:border-box;} body{margin:0;background:#080a06;} input::placeholder,textarea::placeholder{color:#2d4020;}`}</style>
    
          {/* HEADER */}
          <div style={{padding:"20px 16px 14px",background:C.bgCard,borderBottom:`1px solid ${C.border}`,flexShrink:0,position:"relative"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${C.purple},transparent)`}} />
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:3,background:"#1a1230",border:`1px solid ${C.purple}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>🤖</div>
              <div>
                <div style={{fontFamily:"'Oswald',sans-serif",fontSize:20,fontWeight:700,color:C.accent,letterSpacing:2}}>FORGE AI</div>
                <div style={{fontSize:10,color:C.muted2,letterSpacing:2,textTransform:"uppercase"}}>Configurando seu perfil</div>
              </div>
            </div>
          </div>
    
          {/* CHAT */}
          <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:12}}>
            {messages.map((msg,i)=>{
              const isAI = msg.role==="assistant";
              return (
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:isAI?"flex-start":"flex-end"}}>
                  {isAI&&<div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.purple,marginBottom:4,textTransform:"uppercase"}}>🤖 FORGE AI</div>}
                  {!isAI&&<div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.muted2,marginBottom:4,textTransform:"uppercase"}}>VOCÊ</div>}
                  <div style={{background:isAI?C.bgCard:C.accentDim,border:`1px solid ${isAI?C.purple+"33":C.accent+"44"}`,borderRadius:4,padding:"12px 14px",fontSize:15,color:isAI?C.text:C.accentText,lineHeight:1.6,maxWidth:"85%",whiteSpace:"pre-wrap"}}>{msg.content}</div>
                </div>
              );
            })}
    
            {/* CARD DE FOTO */}
            {askingPhoto&&(
              <div style={{background:C.bgCard,border:`1px solid ${C.purple}44`,borderRadius:4,padding:"16px",display:"flex",flexDirection:"column",gap:12}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.purple,textTransform:"uppercase"}}>🤖 FORGE AI</div>
                <div style={{fontSize:14,color:C.text,lineHeight:1.6}}>Quer enviar uma foto do seu físico? A IA consegue estimar sua composição corporal e montar um treino ainda mais preciso. É opcional! 📷</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>handlePhotoChoice(true)} style={{flex:1,background:C.accentDim,border:`1px solid ${C.accent}55`,color:C.accentText,borderRadius:3,padding:"12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif"}}>📷 ENVIAR FOTO</button>
                  <button onClick={()=>handlePhotoChoice(false)} style={{flex:1,background:"transparent",border:`1px solid ${C.border}`,color:C.muted2,borderRadius:3,padding:"12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif"}}>SEM FOTO</button>
                </div>
                <input ref={photoRef} type="file" accept="image/*" capture="user" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handlePhotoUpload(e.target.files[0]);}} />
              </div>
            )}
    
            {loading&&(
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start"}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:C.purple,marginBottom:4,textTransform:"uppercase"}}>🤖 FORGE AI</div>
                <div style={{background:C.bgCard,border:`1px solid ${C.purple}33`,borderRadius:4,padding:"12px 16px",color:C.muted,fontSize:15}}>● ● ●</div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>
    
          {/* INPUT ou BOTÃO FINAL */}
          <div style={{padding:"12px 16px 40px",background:C.bgCard,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
            {done?(
              <button onClick={onDone} style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:3,padding:"16px",fontSize:15,fontWeight:800,letterSpacing:2,cursor:"pointer",fontFamily:"'Oswald',sans-serif"}}>
                ⚔️ ENTRAR NO IRON LOG
              </button>
            ):askingPhoto?(
              <div style={{fontSize:12,color:C.muted,textAlign:"center"}}>Escolha uma opção acima para continuar</div>
            ):(
              <div style={{display:"flex",gap:8,alignItems:"flex-end",position:"relative"}}>
                <div style={{flex:1,background:"#0a0c08",border:`1px solid ${C.border}`,borderRadius:3,padding:"10px 14px"}}>
                  <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}} placeholder="Digite ou segure 🎙 para falar..." rows={1} style={{width:"100%",background:"transparent",border:"none",color:C.text,fontSize:15,outline:"none",resize:"none",fontFamily:"'Barlow Condensed',sans-serif",lineHeight:1.4}} />
                </div>
                <VoiceMicButton onTranscript={(t)=>{ setInput(prev => (prev.trim() ? prev+" "+t : t)); }} />
                <button onClick={sendMessage} disabled={!input.trim()||loading} style={{width:44,height:44,borderRadius:3,background:input.trim()&&!loading?C.accent:"#1a1a1a",border:"none",color:input.trim()&&!loading?"#000":C.muted,fontSize:18,cursor:input.trim()&&!loading?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↑</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── BOTTOM NAV ──
    function BottomNav({active, onChange, onPlusClick}) {
      const tabs = [
        {key:"inicio",    icon:"⚔️", label:"INÍCIO"},
        {key:"exercicios",icon:"🏋️", label:"TREINO"},
        {key:"novo",      icon:"+",  label:"NOVO", special:true},
        {key:"analises",  icon:"📈", label:"ANÁLISES"},
        {key:"coach",     icon:"💬", label:"COACH"},
      ];
      return (
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.bgCard,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:50,paddingBottom:"env(safe-area-inset-bottom)"}}>
          {tabs.map(tab=>{
            const isActive=active===tab.key;
            if(tab.special) return (
              <button key={tab.key} onClick={onPlusClick} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",cursor:"pointer",padding:"8px 4px 10px",position:"relative",top:-12}}>
                <div style={{width:50,height:50,borderRadius:"50%",background:C.accent,border:`3px solid ${C.bg}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 20px ${C.accent}66`}}>
                  <span style={{fontFamily:"'Oswald',sans-serif",fontSize:26,fontWeight:700,color:"#000",lineHeight:1}}>+</span>
                </div>
                <span style={{fontSize:8,fontWeight:700,letterSpacing:1,color:C.accent,marginTop:4}}>{tab.label}</span>
              </button>
            );
            return (
              <button key={tab.key} onClick={()=>onChange(tab.key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",cursor:"pointer",padding:"10px 4px",borderTop:isActive?`2px solid ${C.accent}`:"2px solid transparent"}}>
                <span style={{fontSize:18,marginBottom:2,filter:isActive?"none":"grayscale(0.5)",opacity:isActive?1:0.5}}>{tab.icon}</span>
                <span style={{fontSize:8,fontWeight:700,letterSpacing:1,color:isActive?C.accent:C.muted,textTransform:"uppercase"}}>{tab.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    // ── ROOT CONTROLLER ──
    function App() {
      const [authState, setAuthState] = useState("loading");
      const [user, setUser] = useState(null);

      useEffect(()=>{
        // Deixa o onAuthStateChange ser o árbitro principal
        // O INITIAL_SESSION dispara assim que o token do OAuth é processado
       const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
        if(_event==="INITIAL_SESSION"){
          if(session?.user){
            setUser(session.user);
            checkOnboarding(session.user,false);
          } else {
            setAuthState("auth");
          }
        } else if(_event==="SIGNED_IN"){
          if(session?.user){setUser(session.user);checkOnboarding(session.user,true);}
        } else if(_event==="SIGNED_OUT"){
          setUser(null);setAuthState("auth");
        }
      });
        return()=>subscription.unsubscribe();
      },[]);
      
      const checkOnboarding = async (u, isSignIn=false) => {
        try {
          const flagKey = "ironlog-onboarded-" + u.id;
      
          // 1. Flag local existe → já onboardado, vai pro app
          if (localStorage.getItem(flagKey)) {
            setAuthState("app");
            return;
          }
      
          // 2. Consulta o created_at do perfil no Supabase
          const { data: profile } = await window._sb
            .from("profiles")
            .select("created_at")
            .eq("id", u.id)
            .single();
      
          if (profile?.created_at) {
            const criadoHa = Date.now() - new Date(profile.created_at).getTime();
            const cincoMinutos = 5 * 60 * 1000;
      
            if (criadoHa > cincoMinutos) {
              // Perfil tem mais de 5 min → usuário existente
              localStorage.setItem(flagKey, "1");
              setAuthState("app");
              return;
            }
          }
      
          // 3. Perfil novo ou sem perfil ainda → só manda pro onboarding se for login ativo
          if (isSignIn) {
            setAuthState("ai_onboarding");
          } else {
            setAuthState("app");
          }
        } catch(e) {
          setAuthState("app");
        }
      };

      if(authState==="loading") return (
        <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
          <div style={{fontFamily:"'Oswald',Impact,sans-serif",fontSize:36,color:C.accent,letterSpacing:6,fontWeight:700}}>IRON LOG</div>
          <div style={{fontSize:11,letterSpacing:4,color:C.muted2,textTransform:"uppercase"}}>Carregando...</div>
        </div>
      );
      if(authState==="auth")        return <AuthScreen onAuth={u=>{setUser(u);checkOnboarding(u,true);}} />;
     if(authState==="onboarding")    return <OnboardingScreen onDone={()=>setAuthState("app")} />;
    if(authState==="ai_onboarding") return <AIOnboardingScreen user={user} onDone={()=>{
      localStorage.setItem("ironlog-onboarded-" + user.id, "1");
      setAuthState("app");
    }} />;
    if(authState==="app"&&user)     return <GymLog user={user} onSignOut={()=>{setUser(null);setAuthState("auth");}} />;
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
